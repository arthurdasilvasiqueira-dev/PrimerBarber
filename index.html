  app.innerHTML = `<div class="auth-bg"><div class="auth-card"><div class="auth-inner" style="text-align:center;color:var(--muted);font-size:13px;">Carregando planos...</div></div></div>`;
  const { data, error } = await supa.rpc('get_public_shop_plans', { p_slug: slug });
  if(error || !data || !data.shop_id){
    app.innerHTML = `<div class="auth-bg"><div class="auth-card"><div class="auth-inner" style="text-align:center;color:var(--muted);font-size:13.5px;">Página de planos não encontrada.</div></div></div>`;
    return;
  }
  planPageData = data;
  drawPublicPlans();
}

function drawPublicPlans(){
  const d = planPageData;
  const plans = d.plans || [];
  const social = d.social || {};
  const bookingLink = d.bookingSlug ? `${window.location.origin}${window.location.pathname}?agendar=${d.bookingSlug}` : '';
  const waNumber = (d.phone||'').replace(/\D/g,'');

  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;background:var(--bg);">
      <div style="width:100%;height:180px;background:${d.banner?`url(${d.banner}) center/cover`:'linear-gradient(135deg, var(--panel-2), var(--panel))'};"></div>
      <div style="max-width:1020px;margin:0 auto;padding:0 20px 60px;">
        <div style="display:flex;align-items:flex-end;gap:16px;margin-top:-42px;margin-bottom:20px;flex-wrap:wrap;">
          <div style="width:88px;height:88px;border-radius:18px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);">
            ${d.logo ? `<img src="${d.logo}" style="width:100%;height:100%;object-fit:contain;padding:8px;">` : ''}
          </div>
          <div style="flex:1;min-width:200px;padding-bottom:4px;">
            <h1 class="font-display" style="font-size:28px;font-weight:600;margin-bottom:6px;">${esc(d.name||'Barbearia')}</h1>
            <div style="font-size:13px;color:var(--muted);line-height:1.7;">
              ${d.address?`<div>📍 ${esc(d.address)}</div>`:''}
              ${d.hours?`<div>🕐 ${esc(d.hours)}</div>`:''}
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px;">
            ${bookingLink?`<a href="${bookingLink}" class="btn btn-gold" style="text-decoration:none;">Agende seu horário</a>`:''}
            <button class="btn btn-ghost" id="pp-share">${ICON.copy} Compartilhar</button>
          </div>
        </div>

        <h2 class="font-display" style="font-size:22px;font-weight:600;margin-bottom:18px;text-align:center;">Conheça nossos planos</h2>

        ${plans.length===0 ? `<div style="text-align:center;color:var(--muted);font-size:13.5px;padding:40px 0;">Nenhum plano disponível no momento.</div>` : (()=>{
          // Ordena pelos mais assinados. Só entram no "Top" os planos que
          // realmente têm assinantes — plano sem ninguém não vira Top 1.
          const ordenados = [...plans].sort((a,b)=>{
            const d = (b.subscribers||0) - (a.subscribers||0);
            if(d!==0) return d;
            if(a.featured !== b.featured) return a.featured ? -1 : 1;
            return 0;
          });
          const comAssinantes = ordenados.filter(p=>(p.subscribers||0) > 0);
          const top = comAssinantes.slice(0,3);
          const resto = ordenados.filter(p=>!top.includes(p));

          const cardHtml = (p, rank)=>{
            const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
            const destaque = rank<=3 && rank>0;
            return `
              <div class="card" style="padding:26px 22px 22px;position:relative;display:flex;flex-direction:column;${destaque?'border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);':''}">
                ${destaque ? `<div style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#12140f;font-size:11px;font-weight:700;padding:4px 14px;border-radius:999px;white-space:nowrap;">${medal} Top ${rank} mais assinado</div>`
                  : (p.featured ? `<div style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--panel-2);color:var(--gold-bright);border:1px solid var(--gold);font-size:11px;font-weight:700;padding:4px 14px;border-radius:999px;white-space:nowrap;">★ Melhor opção</div>` : '')}

                <div class="font-display" style="font-size:19px;font-weight:600;margin-bottom:4px;">${esc(p.name)}</div>
                ${p.category?`<div style="font-size:11px;color:var(--muted-2);margin-bottom:12px;">${esc(p.category)}</div>`:'<div style="margin-bottom:12px;"></div>'}

                <div style="margin-bottom:6px;">
                  <span class="font-mono" style="font-size:32px;font-weight:600;color:var(--gold-bright);">${BRL(p.price)}</span>
                  <span style="font-size:12.5px;color:var(--muted-2);">/mês</span>
                </div>
                ${(p.subscribers||0)>0?`<div style="font-size:11.5px;color:var(--muted-2);margin-bottom:16px;">${p.subscribers} assinante${p.subscribers>1?'s':''}</div>`:'<div style="margin-bottom:16px;"></div>'}

                ${(p.validDays||[]).length && (p.validDays||[]).length<7 ? `
                  <div style="background:rgba(201,162,75,.1);border:1px solid rgba(201,162,75,.3);border-radius:8px;padding:8px 11px;margin-bottom:14px;font-size:12px;color:var(--gold-bright);font-weight:600;">
                    🗓 ${esc(planDaysLabel(p.validDays))}

                ` : (p.validDays||[]).length===7 ? `
                  <div style="background:var(--panel-2);border-radius:8px;padding:8px 11px;margin-bottom:14px;font-size:12px;color:var(--muted);">
                    🗓 Válido a semana toda

                ` : ''}

                ${(p.benefitsList||[]).length ? `
                  <div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:18px;flex:1;">
                    <div style="font-size:10.5px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;">Incluso:</div>
                    <div style="display:flex;flex-direction:column;gap:7px;">
                      ${p.benefitsList.map(b=>`<div style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.5;"><span style="color:var(--gold-bright);flex-shrink:0;">✓</span><span>${esc(b)}</span></div>`).join('')}
                    </div>
                  </div>
                ` : `<div style="flex:1;"></div>`}

                <button class="btn btn-gold pp-subscribe" data-plan="${esc(p.id)}" style="justify-content:center;width:100%;">ASSINAR</button>
              </div>`;
          };

          return `
            ${top.length ? `
              <div style="text-align:center;font-size:12px;color:var(--muted-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Os mais escolhidos pelos nossos clientes</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:18px;margin-bottom:${resto.length?'38px':'0'};">
                ${top.map((p,i)=>cardHtml(p, i+1)).join('')}
              </div>
            ` : ''}
            ${resto.length ? `
              ${top.length?`<div style="text-align:center;font-size:12px;color:var(--muted-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Outros planos</div>`:''}
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:18px;">
                ${resto.map(p=>cardHtml(p, 0)).join('')}
              </div>
            ` : ''}
          `;
        })()}
        ${(d.clubAbout||d.bio) ? `
          <div class="card" style="padding:22px 24px;margin-top:38px;">
            <div class="font-display" style="font-size:17px;font-weight:600;margin-bottom:10px;">Sobre</div>
            <div style="font-size:13.5px;color:var(--muted);line-height:1.75;white-space:pre-line;">${esc(d.clubAbout || d.bio)}</div>
            ${(social.instagram||social.facebook||social.tiktok||waNumber||social.website) ? `
              <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
                ${waNumber?`<a href="https://wa.me/55${waNumber}" target="_blank" class="pill pill-muted" style="text-decoration:none;">${ICON.chat} WhatsApp</a>`:''}
                ${social.instagram?`<a href="${social.instagram.startsWith('http')?esc(social.instagram):'https://instagram.com/'+esc(social.instagram.replace('@',''))}" target="_blank" class="pill pill-muted" style="text-decoration:none;">${ICON.instagram} Instagram</a>`:''}
                ${social.facebook?`<a href="${esc(social.facebook)}" target="_blank" class="pill pill-muted" style="text-decoration:none;">${ICON.facebook} Facebook</a>`:''}
                ${social.tiktok?`<a href="${social.tiktok.startsWith('http')?esc(social.tiktok):'https://tiktok.com/@'+esc(social.tiktok.replace('@',''))}" target="_blank" class="pill pill-muted" style="text-decoration:none;">${ICON.tiktok} TikTok</a>`:''}
                ${social.website?`<a href="${esc(social.website)}" target="_blank" class="pill pill-muted" style="text-decoration:none;">${ICON.globe} Site</a>`:''}
              </div>
            ` : ''}
          </div>
        ` : ''}

      </div>
    </div>
  `;
  document.getElementById('pp-share')?.addEventListener('click', ()=>{
    const url = window.location.href;
    if(navigator.share) navigator.share({title:d.name, url});
    else { navigator.clipboard?.writeText(url); showToast('Link copiado!'); }
  });
  document.querySelectorAll('.pp-subscribe').forEach(b=>b.addEventListener('click', ()=>{
    const plan = plans.find(p=>p.id===b.dataset.plan);
    if(plan) publicSubscribeModal(plan);
  }));
}

        <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:14px;">
          ${plan.benefitsList.map(b=>`<div style="display:flex;gap:8px;font-size:12.5px;color:var(--muted);"><span style="color:var(--gold-bright);">✓</span><span>${esc(b)}</span></div>`).join('')}

      `:''}
      <div class="font-mono" style="font-size:26px;color:var(--gold-bright);margin-bottom:20px;">${BRL(plan.price)}<span style="font-size:12px;color:var(--muted-2);">/mês</span></div>
      <div style="font-size:13px;font-weight:600;margin-bottom:12px;">Seus dados</div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div><label>Nome completo</label><input id="ps-name" style="width:100%;"></div>
        <div><label>Telefone / WhatsApp</label><input id="ps-phone" placeholder="(00) 00000-0000" style="width:100%;"></div>
        <div><label>E-mail</label><input id="ps-email" type="email" style="width:100%;"></div>
        <div><label>CPF (opcional)</label><input id="ps-cpf" style="width:100%;"></div>
        <button class="btn btn-gold" id="ps-submit" style="justify-content:center;margin-top:4px;">Enviar pedido de assinatura</button>
        <div style="font-size:11px;color:var(--muted-2);text-align:center;line-height:1.5;">A barbearia vai receber seu pedido e entrar em contato com o link de pagamento.</div>
      </div>

        <div style="font-size:12.5px;color:var(--muted);">Em breve a barbearia entra em contato com você.</div>
      </div>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#ps-submit').addEventListener('click', async (e)=>{
      const name = root.querySelector('#ps-name').value.trim();
      const phone = root.querySelector('#ps-phone').value.trim();
      const email = root.querySelector('#ps-email').value.trim();
      const cpf = root.querySelector('#ps-cpf').value.trim();
      if(!name || !phone){ showToast('Preencha ao menos nome e telefone.'); return; }
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = 'Enviando...';

      if(error){ showToast('Não foi possível enviar. Tente novamente.'); return; }
      root.querySelector('#ps-done').style.display = 'block';
      root.querySelector('#ps-submit').style.display = 'none';

let teamSession = null; // {shopId, profId, pin} — quando a equipe entra sem o login do dono
let agendaDate = null; // dia visível na agenda (não é salvo no banco)
let agendaMode = 'grade'; // 'grade' (quadro de horários) ou 'lista'

async function renderTeamLogin(slug, errorMsg){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="auth-bg"><div class="auth-card"><div class="auth-inner" style="text-align:center;color:var(--muted);font-size:13px;">Carregando...</div></div></div>`;
  const { data, error } = await supa.rpc('get_shop_team', { p_slug: slug });
  if(error || !data || !data.shop_id){
    app.innerHTML = `<div class="auth-bg"><div class="auth-card"><div class="auth-inner" style="text-align:center;color:var(--muted);font-size:13.5px;">Link de acesso não encontrado.</div></div></div>`;
    return;
  }
  const team = data.team || [];
  app.innerHTML = `
    <div class="auth-bg">
      <div class="auth-card">
        <div class="auth-inner">
          ${data.logo ? `<img src="${data.logo}" style="width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 14px;">` : ''}
          <div class="auth-eyebrow">Acesso da equipe</div>
          <div class="auth-title font-display" style="font-weight:600;font-size:22px;">${esc(data.shop_name||'Barbearia')}</div>
          <div class="auth-subtitle">Escolha seu nome e digite seu PIN.</div>
          ${errorMsg?`<div class="auth-error">${esc(errorMsg)}</div>`:''}
          ${team.length===0 ? `<div style="text-align:center;color:var(--muted);font-size:13px;">Nenhum profissional cadastrado ainda.</div>` : `
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${team.map(p=>`
                <div style="display:flex;gap:8px;align-items:center;">
                  <div style="flex:1;min-width:0;">
                    <div style="font-size:13.5px;font-weight:500;">${esc(p.name)}</div>
                    <div style="font-size:11px;color:var(--muted-2);">${roleLabel(p.accessRole)}</div>
                  </div>
                  <input type="password" inputmode="numeric" maxlength="8" placeholder="PIN" data-team-pin="${p.id}" style="width:84px;text-align:center;">
                  <button class="btn btn-gold" style="padding:9px 12px;" data-team-login="${p.id}">Entrar</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    </div>
  `;
  app.querySelectorAll('[data-team-login]').forEach(b=>b.addEventListener('click', async ()=>{
    const profId = b.dataset.teamLogin;
    const pin = app.querySelector(`[data-team-pin="${profId}"]`).value.trim();
    if(!pin){ renderTeamLogin(slug, 'Digite seu PIN.'); return; }
    b.disabled = true; b.textContent = '...';
    const { data: res, error: err } = await supa.rpc('team_login', { p_shop_id: data.shop_id, p_prof_id: profId, p_pin: pin });
    b.disabled = false; b.textContent = 'Entrar';
    if(err || !res || res.error){ renderTeamLogin(slug, res?.error || 'Não foi possível entrar.'); return; }
    teamSession = { shopId: data.shop_id, profId, pin };
    currentShop = { id: data.shop_id, data: res.data, plan: 'pro', subscription_status: 'active', email: '' };
    const prof = (res.data.professionals||[]).find(p=>p.id===profId);
    userSession = { role: prof?.accessRole || 'profissional', professionalId: profId };
    route = 'dashboard';
    await loadState();
  }));
}

  const isLogin = mode!=='signup';
  authShell(`

    <div class="auth-subtitle">${isLogin?'Entre para acessar o painel da sua barbearia.':'Monte sua agenda, equipe e clube de assinatura em minutos.'}</div>
    ${!isLogin?`<div class="auth-trial-row"><span class="auth-trial-pill">${ICON.star} ${TRIAL_DAYS} dias grátis · sem cartão</span></div>`:''}
    ${errorMsg?`<div class="auth-error">${errorMsg}</div>`:''}
    <div style="display:flex;flex-direction:column;gap:16px;">
      ${!isLogin?`<div class="auth-field"><label>Nome da barbearia</label><input id="au-shop" placeholder="Ex: Primer Barber"></div>`:''}
      <div class="auth-field"><label>Email</label><input id="au-email" type="email" placeholder="voce@email.com"></div>
      <div class="auth-field"><label>Senha</label><input id="au-pass" type="password" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn btn-gold auth-submit" id="au-submit">${isLogin?'Entrar':'Criar conta grátis'}</button>
      <button class="btn btn-ghost auth-switch" id="au-switch">${isLogin?'Não tem conta? Criar uma':'Já tem conta? Entrar'}</button>
      ${!isLogin?`<div style="text-align:center;font-size:11.5px;color:var(--muted-2);line-height:1.6;margin-top:4px;">Ao criar sua conta, você concorda com os<br><a href="?pagina=termos" target="_blank" style="color:var(--muted);">Termos de Uso</a> e a <a href="?pagina=privacidade" target="_blank" style="color:var(--muted);">Política de Privacidade</a>.</div>`:''}
    </div>
  `);
  document.getElementById('au-switch').addEventListener('click', ()=>renderAuthScreen(isLogin?'signup':'login'));
  document.getElementById('au-submit').addEventListener('click', async ()=>{
    const email = document.getElementById('au-email').value.trim();
    const pass = document.getElementById('au-pass').value;
    const shopName = document.getElementById('au-shop')?.value.trim();
    if(!email || !pass){ renderAuthScreen(mode, 'Preencha email e senha.'); return; }
    if(isLogin){
      const { error } = await supa.auth.signInWithPassword({ email, password: pass });
      if(error){ renderAuthScreen('login', 'Não foi possível entrar: '+error.message); return; }
    } else {
      const { error } = await supa.auth.signUp({ email, password: pass });
      if(error){ renderAuthScreen('signup', 'Não foi possível criar a conta: '+error.message); return; }
      await ensureShop(shopName || 'Minha barbearia');
    }
    boot();
  });
}

async function ensureShop(defaultName){
  const { data: { user } } = await supa.auth.getUser();
  if(!user) return null;
  const { data: existing } = await supa.from('shops').select('*').eq('owner_id', user.id).maybeSingle();
  if(existing) return existing;
  const trialEnds = new Date(Date.now() + TRIAL_DAYS*24*60*60*1000).toISOString();
  const seeded = blankShopData();
  if(defaultName) seeded.shopProfile.name = defaultName;
  const baseSlug = slugify(defaultName || 'barbearia');
  const uniqueSlug = baseSlug + '-' + Math.random().toString(36).slice(2,7);
  seeded.onlineBooking.slug = uniqueSlug;
  const { data: created, error } = await supa.from('shops').insert({
    owner_id: user.id,
    email: user.email,
    data: seeded,
    booking_slug: uniqueSlug,
    subscription_status: 'trialing',
    trial_ends_at: trialEnds,
  }).select().single();
  if(error){ console.error('Erro ao criar barbearia', error); return null; }
  // Avisa o dono do sistema por e-mail. Se falhar, não atrapalha o cadastro.
  supa.functions.invoke('notify-signup', {
    body: { event:'signup', shopName: seeded.shopProfile.name, email: user.email }
  }).catch(()=>{});
  return created;
}
function slugify(text){
  return (text||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'barbearia';
}

function shopIsActive(shop){
  if(shop.subscription_status==='active') return true;
  if(shop.subscription_status==='trialing'){
    return new Date(shop.trial_ends_at).getTime() > Date.now();
  }
  return false;
}

function planPickerHtml(shop){
  const mk = (planKey, link) => {
    const limits = PLAN_LIMITS[planKey];
    const url = link.startsWith('http')
      ? `${link}${link.includes('?')?'&':'?'}client_reference_id=${shop.id}&prefilled_email=${encodeURIComponent(shop.email||'')}`
      : null;
    const isPro = planKey==='pro';
    return `
      <div class="card" style="padding:18px 20px;margin-bottom:12px;${isPro?'border-color:rgba(201,162,75,.4);background:linear-gradient(160deg, var(--panel), var(--panel-2));':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div class="font-display" style="font-size:17px;font-weight:600;">${limits.label}</div>
          ${shop.plan===planKey && shop.subscription_status==='active' ? `<span class="pill pill-ok">Plano atual</span>` : isPro ? `<span class="pill" style="background:rgba(201,162,75,.14);color:var(--gold-bright);border-color:rgba(201,162,75,.3);">Mais popular</span>` : ''}
        </div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;">
          ${planKey==='basic'
            ? 'Até 4 profissionais cadastrados. Sem Clube de Assinatura.'
            : 'Profissionais ilimitados. Clube de Assinatura ativado.'}
        </div>
        ${url
          ? `<a href="${url}" target="_blank" class="btn ${isPro?'btn-gold':'btn-ghost'} auth-switch" style="text-decoration:none;">Assinar ${limits.label}</a>`
          : `<div class="pill pill-warn" style="display:block;">Link do plano ${limits.label} não configurado</div>`}
      </div>
    `;
  };
  return mk('basic', STRIPE_PAYMENT_LINK_BASIC) + mk('pro', STRIPE_PAYMENT_LINK_PRO);
}

function renderPaywallUpgrade(fromRoute){
  authShell(`
    <div class="auth-title font-display" style="font-weight:600;font-size:22px;">Fazer upgrade</div>
    <div class="auth-subtitle">Escolha o plano Pro para liberar este recurso.</div>
    ${planPickerHtml(currentShop)}
    <button class="btn btn-ghost auth-switch" id="pw-back" style="margin-top:14px;">Voltar</button>
  `);
  document.getElementById('pw-back').addEventListener('click', ()=>{ route = fromRoute; render(); });
}

async function boot(){
  if(!supa){ renderConfigMissing(); return; }
  const urlParams = new URLSearchParams(window.location.search);
  const legalPage = urlParams.get('pagina');
  if(legalPage==='termos' || legalPage==='privacidade'){ renderLegalPage(legalPage); return; }
  const bookSlug = urlParams.get('agendar');
  if(bookSlug){ await renderPublicBooking(bookSlug); return; }
  const teamSlug = urlParams.get('equipe');
  if(teamSlug){ await renderTeamLogin(teamSlug); return; }
  const plansSlug = urlParams.get('planos');
  if(plansSlug){ await renderPublicPlans(plansSlug); return; }
  const clientSlug = urlParams.get('cliente');
  if(clientSlug){ await renderClientLogin(clientSlug); return; }
  const { data: { session } } = await supa.auth.getSession();
  if(!session){ renderAuthScreen('login'); return; }
  let shop = await ensureShop();
  if(!shop){
    // fallback: pode já existir mas a criação acima não rodou (ex: login direto)
    const { data } = await supa.from('shops').select('*').eq('owner_id', session.user.id).maybeSingle();
    shop = data;
  }
  if(!shop){ renderAuthScreen('login', 'Não encontramos sua barbearia. Fale com o suporte.'); return; }
  currentShop = shop;
  if(!shopIsActive(shop)){ renderPaywallScreen(shop); return; }
  await loadState();
  await refreshNotifItems();
  subscribeBookingNotifications();
}
