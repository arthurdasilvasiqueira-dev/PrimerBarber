<style>
  /* ===== Tema ESCURO — preto neutro, branco e dourado ===== */
  :root[data-theme="dark"]{
    --bg:#0c0d0f;
    --panel:#15171a;
    --panel-2:#1e2126;
    --border:#2a2e35;
    --gold:#c9a24b;
    --gold-bright:#e3c078;
    --ink:#f4f5f6;
    --muted:#a2a8b0;
    --muted-2:#737a84;
    --ok:#5fa96f;
    --ok-bg:#16241a;
    --bad:#cf6b5c;
    --bad-bg:#2a1a18;
    --warn:#d0a94f;
    /* painel lateral — preto mais fundo que o conteúdo */
    --side-bg:#0a0b0d;
    --side-ink:#f4f5f6;
    --side-muted:#a2a8b0;
    --side-muted-2:#737a84;
    --side-border:#23272d;
    --side-hover:#1a1d22;
  }
  /* ===== Tema CLARO — padrão do sistema ===== */
  :root, :root[data-theme="light"]{
    --bg:#f4f4f5;
    --panel:#ffffff;
    --panel-2:#f0f0f1;
    --border:#e0e0e2;
    --gold:#b8912f;
    --gold-bright:#8f6f19;
    --ink:#14161a;
    --muted:#5c6067;
    --muted-2:#8b9098;
    --ok:#2f7a3f;
    --ok-bg:#e8f2ea;
    --bad:#b03328;
    --bad-bg:#fbe9e7;
    --warn:#8a6a10;
    /* painel lateral segue preto mesmo no tema claro */
    --side-bg:#101215;
    --side-ink:#f5f5f6;
    --side-muted:#a3a8b0;
    --side-muted-2:#767c86;
    --side-border:#262a30;
    --side-hover:#1c2026;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--gold);color:#1a1610;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  a,button{font-family:inherit;}
  button{cursor:pointer;}
  input,select,textarea{font-family:inherit;background:var(--panel-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);}
  input::placeholder{color:var(--muted-2);}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;letter-spacing:.02em;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  .btn{border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;border:1px solid transparent;transition:all .15s;display:inline-flex;align-items:center;gap:7px;}
  .btn-gold{background:var(--gold);color:#1a1610;}
  .btn-gold:hover{background:var(--gold-bright);}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn-danger{background:transparent;border-color:var(--bad);color:var(--bad);}
  .btn-danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .divider-blade{height:2px;border-radius:2px;background:linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold-bright) 50%, var(--gold) 85%, transparent);opacity:.55;}

  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;color:var(--side-muted);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid transparent;}
  .nav-item:hover{color:var(--side-ink);background:var(--side-hover);}
  .nav-item.active{color:#e3c078;background:var(--side-hover);border-color:var(--side-border);}
  /* dentro do painel lateral, o texto segue a paleta escura */
  .sidebar{color:var(--side-ink);}
  .sidebar .btn-ghost{border-color:var(--side-border);color:var(--side-muted);}
  .sidebar .btn-ghost:hover{border-color:#c9a24b;color:#e3c078;}
  .nav-item svg{flex-shrink:0;}
  .grid-slot:hover{background:rgba(201,162,75,.16);box-shadow:inset 0 0 0 1px var(--gold);}

  .pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.02em;}
  .pill-ok{background:var(--ok-bg);color:var(--ok);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);}
  .pill-warn{background:#2c2515;color:var(--warn);}
  .pill-muted{background:var(--panel-2);color:var(--muted);}

  .ticket{position:relative;background:var(--panel-2);border:1px solid var(--border);border-radius:10px 10px 0 0;padding:14px 16px 18px;}
  .ticket::after{
    content:'';display:block;position:absolute;left:0;right:0;bottom:-9px;height:10px;
    background-image:
      linear-gradient(135deg, var(--panel-2) 50%, transparent 50%),
      linear-gradient(-135deg, var(--panel-2) 50%, transparent 50%);
    background-size:14px 14px;background-position:left bottom;background-repeat:repeat-x;
  }
  .modal-overlay{position:fixed;inset:0;background:rgba(10,8,6,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);color:var(--ink);padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);}

  /* ===== Tela de acesso (login / cadastro / paywall) ===== */
  .auth-bg{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    padding:28px 20px; position:relative; overflow:hidden;
    background:
      radial-gradient(1100px 560px at 50% -8%, rgba(201,162,75,.16), transparent 62%),
      radial-gradient(700px 420px at 100% 100%, rgba(201,162,75,.06), transparent 55%),
      repeating-linear-gradient(128deg, rgba(201,162,75,.035) 0px, rgba(201,162,75,.035) 1.5px, transparent 1.5px, transparent 30px),
      #0a0b0d;
  }
  .auth-card{
    width:100%; max-width:408px; position:relative; z-index:1;
    background:var(--panel); border:1px solid var(--border); border-radius:22px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(201,162,75,.05);
    overflow:hidden;
  }
  .auth-stripe{
    height:5px; width:100%;
    background:repeating-linear-gradient(52deg,
      #c9a24b 0px, #c9a24b 9px,
      #e3c078 9px, #e3c078 18px,
      #0a0b0d 18px, #0a0b0d 22px,
      #e3c078 22px, #e3c078 31px);
    background-size:44px 100%;
    flex-shrink:0;
  }
  .auth-inner{padding:36px 34px 32px;}
  .auth-logo-wrap{
    width:60px; height:60px; border-radius:16px; margin:0 auto 18px;
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; padding:11px;
    box-shadow:0 10px 26px -10px rgba(201,162,75,.35), inset 0 0 0 1px rgba(201,162,75,.08);
  }
  .auth-eyebrow{
    text-align:center; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted-2); margin-bottom:6px; font-weight:600;
  }
  .auth-title{
    text-align:center; font-size:26px; line-height:1.15; margin-bottom:8px;
  }
  .auth-subtitle{
    text-align:center; font-size:13px; color:var(--muted); margin-bottom:26px; line-height:1.55;
  }
  .auth-trial-pill{
    display:inline-flex; align-items:center; gap:6px; margin:0 auto 22px; padding:6px 14px;
    border-radius:999px; background:rgba(201,162,75,.1); border:1px solid rgba(201,162,75,.28);
    color:var(--gold-bright); font-size:11.5px; font-weight:600; letter-spacing:.02em;
  }
  .auth-trial-row{display:flex; justify-content:center;}
  .auth-field label{font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted-2); font-weight:600; margin-bottom:6px; display:block;}
  .auth-field input{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:11px;
    padding:12px 14px; font-size:14px; color:var(--ink); transition:border-color .15s, box-shadow .15s;
  }
  .auth-field input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,75,.12); outline:none;}
  .auth-submit{
    width:100%; justify-content:center; padding:13px; font-size:14px; font-weight:600;
    border-radius:11px; margin-top:4px; box-shadow:0 12px 26px -12px rgba(201,162,75,.5);
  }
  .auth-switch{width:100%; justify-content:center; padding:11px; font-size:13px; border-radius:11px;}
  .auth-error{
    background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:11px 13px;
    font-size:12.5px; margin-bottom:16px; border:1px solid rgba(193,123,106,.25); line-height:1.5;
  }
  @media (max-width:480px){ .auth-inner{padding:28px 22px 26px;} .auth-title{font-size:22px;} }
  .legal-content h2{font-size:16px;font-weight:600;margin:26px 0 10px;color:var(--gold-bright);}
  .legal-content h2:first-child{margin-top:0;}
  .legal-content p{margin-bottom:12px;color:var(--muted);}
  .legal-content ul{margin:0 0 12px 20px;color:var(--muted);}
  .legal-content li{margin-bottom:6px;}
  .legal-content b{color:var(--ink);}

  .tab-scroll{scrollbar-width:thin;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);font-weight:600;padding:0 12px 10px;}
  td{padding:12px;font-size:14px;border-top:1px solid var(--border);}
  tr:hover td{background:rgba(255,255,255,.015);}

  /* ===== Adaptação para celular ===== */
  .mobile-topbar{display:none;}
  .mobile-drawer{display:none;}
  @media (max-width: 860px){
    /* menu lateral vira gaveta que abre por cima */
    .sidebar{
      /* !important é necessário: o elemento tem position:sticky inline,
         que venceria esta regra e deixaria a barra ocupando espaço. */
      position:fixed !important; top:0 !important; left:0 !important; bottom:0 !important;
      z-index:120;
      transform:translateX(-100%); transition:transform .22s ease;
      width:270px !important; height:100vh !important; max-width:85vw;
      box-shadow:14px 0 40px -12px rgba(0,0,0,.6);
    }
    /* trava qualquer rolagem lateral indesejada */
    html, body{max-width:100%; overflow-x:hidden;}
    body.drawer-open .sidebar{transform:translateX(0);}
    .mobile-drawer{
      display:block; position:fixed; inset:0; z-index:110;
      background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .22s;
    }
    body.drawer-open .mobile-drawer{opacity:1; pointer-events:auto;}
    .mobile-topbar{
      display:flex; align-items:center; gap:12px;
      position:sticky; top:0; z-index:90;
      background:var(--side-bg); border-bottom:1px solid var(--side-border);
      padding:11px 14px; color:var(--side-ink);
    }
    main{padding:18px 15px 90px !important; max-width:100% !important;}
    /* cartões e tabelas respiram melhor */
    .card{border-radius:12px;}
    table{display:block; overflow-x:auto; white-space:nowrap;}
    /* alvos de toque maiores */
    .btn{padding:11px 15px; font-size:14px;}
    input, select, textarea{font-size:16px;} /* evita o zoom automático do iPhone */
    .dash-grid{grid-template-columns:1fr !important;}
    .desk-bell{display:none !important;}
    /* grade da agenda: colunas mais estreitas e rolagem lateral suave */
    .card{scrollbar-width:thin;}
    /* páginas públicas ocupam a largura toda */
    .auth-card{max-width:100% !important;}
    /* cabeçalhos de página não quebram feio */
    .pill{font-size:11px;}
    /* modais viram uma folha que sobe de baixo */
    .modal-overlay{align-items:flex-end !important; padding:0 !important;}
    .modal{
      max-height:92vh; overflow-y:auto;
      border-radius:20px 20px 0 0 !important;
      width:100% !important; max-width:100% !important;
      padding-bottom:env(safe-area-inset-bottom);
    }
  }
  @media (max-width: 520px){
    h1, .font-display{letter-spacing:-.01em;}
    main{padding:14px 12px 90px !important;}
  }
  /* Quando instalado como app (tela cheia), respeita o entalhe do celular */
  @media (display-mode: standalone){
    .mobile-topbar{padding-top:calc(11px + env(safe-area-inset-top));}
  }
</style>
</head>

async function persist(){
  if(!supa || !currentShop) return;
  try{
    if(teamSession){
      // Equipe logada por PIN — grava por uma função que revalida o PIN
      const { data: res, error } = await supa.rpc('team_save', {
        p_shop_id: teamSession.shopId, p_prof_id: teamSession.profId,
        p_pin: teamSession.pin, p_data: state
      });
      if(error || res?.error) console.error('Falha ao salvar', error || res.error);
      return;
    }
    const slug = state?.onlineBooking?.slug || null;
    const { error } = await supa.from('shops').update({ data: state, booking_slug: slug || null }).eq('id', currentShop.id);
    if(error) console.error('Falha ao salvar', error);
  }catch(e){ console.error('Falha ao salvar', e); }
}

const PAYMENT_METHODS = [
  {id:'dinheiro', label:'Dinheiro', inDrawer:true},
  {id:'pix', label:'PIX', inDrawer:false},
  {id:'debito', label:'Cartão de débito', inDrawer:false},

];
function methodLabelPay(id){ return (PAYMENT_METHODS.find(m=>m.id===id)||{}).label || 'Dinheiro'; }
function sessionTotals(session){
  if(!session) return {in:0,out:0,balance:0,byMethod:{},cashIn:0,cashOut:0};
  const entries = session.entries;
  const inn = entries.filter(e=>e.type==='entrada').reduce((a,e)=>a+Number(e.amount),0);
  const out = entries.filter(e=>e.type==='saida').reduce((a,e)=>a+Number(e.amount),0);
  // Detalhamento por forma de pagamento (entradas)
  const byMethod = {};
  PAYMENT_METHODS.forEach(m=>{ byMethod[m.id] = 0; });
  entries.filter(e=>e.type==='entrada').forEach(e=>{
    const m = e.method || 'dinheiro';
    byMethod[m] = (byMethod[m]||0) + Number(e.amount);
  });
  // O caixa físico (gaveta) só conta o que entrou/saiu em dinheiro
  const cashIn = entries.filter(e=>e.type==='entrada' && (e.method||'dinheiro')==='dinheiro').reduce((a,e)=>a+Number(e.amount),0);
  const cashOut = entries.filter(e=>e.type==='saida' && (e.method||'dinheiro')==='dinheiro').reduce((a,e)=>a+Number(e.amount),0);
  return {in:inn, out, byMethod, cashIn, cashOut, balance: session.openingAmount + cashIn - cashOut};
}

function weekDates(){
  const now = new Date();
  const day = (now.getDay()+6)%7; // 0 = segunda
  const monday = new Date(now); monday.setDate(now.getDate()-day);
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    return d.toISOString().slice(0,10);
  });
}
function clientsPerProfPerDay(profId, date){
  return state.appointments.filter(a=>a.professionalId===profId && a.date===date && a.status!=='cancelado').length;

function clientStats(name){
  const own = state.appointments.filter(a=>a.client.trim().toLowerCase()===name.trim().toLowerCase());
  const done = own.filter(a=>a.status==='concluido');
  const total = done.reduce((a,ap)=>a+(serviceById(ap.serviceId)?.price||0),0);
  const last = done.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];
  return {visits: done.length, total, lastVisit: last ? last.date : null};
}
function monthDayLabel(md){
  if(!md) return '—';
  const [m,d] = md.split('-');
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${d} ${meses[parseInt(m)-1]}`;

function fillTemplate(tpl, vars){

function waLink(phone, text){

function pendingReminders(){

    const diffH = (apptTime-now)/3600000;

function suggestServicesFor(clientName){
  const done = new Set(state.appointments.filter(a=>a.status==='concluido' && a.client.trim().toLowerCase()===clientName.trim().toLowerCase()).map(a=>a.serviceId));
  return state.services.filter(s=>!done.has(s.id));
}
function phoneForClientName(name){
  return state.clients.find(c=>c.name.trim().toLowerCase()===name.trim().toLowerCase())?.phone || '';
}
function currentPeriod(){ return todayISO().slice(0,7); }
function commissionOwed(profId){
  const prof = state.professionals.find(p=>p.id===profId);
  const period = currentPeriod();
  const paidService = state.commissionPayments.filter(c=>c.professionalId===profId && c.source==='servico').reduce((a,c)=>a+Number(c.amount),0);
  const paidPote = state.commissionPayments.filter(c=>c.professionalId===profId && c.source==='pote' && c.period===period).reduce((a,c)=>a+Number(c.amount),0);
  const paidSaque = state.commissionPayments.filter(c=>c.professionalId===profId && c.source==='saque').reduce((a,c)=>a+Number(c.amount),0);
  // vales (adiantamentos) também descontam do que o profissional tem a receber
  const paidVale = state.commissionPayments.filter(c=>c.professionalId===profId && c.source==='vale').reduce((a,c)=>a+Number(c.amount),0);
  const concludedAppts = state.appointments.filter(a=>a.professionalId===profId && a.status==='concluido').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let serviceEarned = 0;
  concludedAppts.forEach(ap=>{
    const s = serviceById(ap.serviceId); if(!s) return;
    const pct = (prof.serviceOverrides && prof.serviceOverrides[ap.serviceId]!=null) ? prof.serviceOverrides[ap.serviceId] : prof.commission;
    serviceEarned += s.price * (pct/100);
  });
  const potEarned = potCommissionForProf(profId);
  const serviceOwed = Math.max(0, serviceEarned - paidService);
  const potOwed = Math.max(0, potEarned - paidPote);
  const totalEarned = serviceEarned + potEarned;
  const totalPaid = paidService + paidPote + paidSaque + paidVale;
  return {
    earned: totalEarned, serviceEarned, potEarned,
    paid: totalPaid, paidService, paidPote, paidSaque, paidVale,
    owed: Math.max(0, totalEarned - totalPaid), serviceOwed, potOwed,
  };
}
function monthlyEarnedForProf(profId){
  const prof = state.professionals.find(p=>p.id===profId);
  if(!prof) return 0;
  const period = currentPeriod();
  const concludedThisMonth = state.appointments.filter(a=>a.professionalId===profId && a.status==='concluido' && a.date.startsWith(period));
  let total = 0;
  concludedThisMonth.forEach(ap=>{
    const s = serviceById(ap.serviceId); if(!s) return;
    const pct = (prof.serviceOverrides && prof.serviceOverrides[ap.serviceId]!=null) ? prof.serviceOverrides[ap.serviceId] : prof.commission;
    total += s.price * (pct/100);
  });
  return total + potCommissionForProf(profId);
}
function effectiveCommissionPercent(prof, serviceId){
  return (prof.serviceOverrides && prof.serviceOverrides[serviceId]!=null) ? prof.serviceOverrides[serviceId] : prof.commission;
}

/* ============ #4 HORÁRIOS E FOLGAS POR PROFISSIONAL ============ */
function isProfessionalWorking(prof, dateStr){
  const weekday = new Date(dateStr+'T00:00').getDay();
  if(!prof.workDays.includes(weekday)) return false;
  if(prof.timeOff.includes(dateStr)) return false;
  return true;
}
function timesOverlap(startA,durA,startB,durB){
  const toMin = t=>{ const [hh,mm]=t.split(':').map(Number); return hh*60+mm; };
  const aStart=toMin(startA), aEnd=aStart+durA, bStart=toMin(startB), bEnd=bStart+durB;
  return aStart<bEnd && bStart<aEnd;
}
function generateSlotsForProfessional(prof, dateStr, durationMin){
  if(!isProfessionalWorking(prof, dateStr)) return [];
  const slots = [];
  let [h,m] = prof.workStart.split(':').map(Number);
  const [eh,em] = prof.workEnd.split(':').map(Number);
  const workEndMinutes = eh*60+em;
  while(h*60+m < workEndMinutes){
    const timeStr = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    if(h*60+m+durationMin <= workEndMinutes){
      const conflict = state.appointments.some(a=>a.professionalId===prof.id && a.date===dateStr && a.status!=='cancelado' && a.status!=='faltou' &&
        timesOverlap(a.time, serviceById(a.serviceId)?.duration||30, timeStr, durationMin));
      if(!conflict) slots.push(timeStr);
    }
    m+=15; if(m>=60){ m-=60; h+=1; }
  }
  return slots;
}

function noShowStats(){

/* ============ SISTEMA DE POTE (clube de assinatura) — por fichas ============ */
// Todo mês, a soma de todos os assinantes pagos forma UM pote geral.
// Desse pote, uma % fica pra barbearia e o restante ("bolo dos profissionais")
// é dividido proporcionalmente pela quantidade de fichas que cada profissional
// acumulou no mês. Cada serviço tem um valor de fichas configurável — quando
// um profissional atende um cliente assinante pago, ganha as fichas daquele serviço.
function clubMonthlyPot(){
  return state.subscriptionMembers.filter(m=>m.status==='pago').reduce((total,m)=>{
    const plan = state.subscriptionPlans.find(p=>p.id===m.planId);
    return total + (plan ? plan.price : 0);
  }, 0);
}
function clubFichaEntries(){
  const monthPrefix = todayISO().slice(0,7);
  const payingNames = new Set(state.subscriptionMembers.filter(m=>m.status==='pago').map(m=>m.name.trim().toLowerCase()));
  return state.appointments
    .filter(a=>a.status==='concluido' && a.date.startsWith(monthPrefix) && payingNames.has(a.client.trim().toLowerCase()))
    .map(a=>{
      const service = serviceById(a.serviceId);
      return {appt:a, service, fichas: service?.clubFichas||0};
    })
    .filter(e=>e.fichas>0);
}
function clubFichasBreakdown(){
  const entries = clubFichaEntries();
  const totalFichas = entries.reduce((a,e)=>a+e.fichas,0);
  const potTotal = clubMonthlyPot();
  const staffPercent = state.commissionSettings.clubStaffPercent ?? 60;
  const potStaff = potTotal * (staffPercent/100);
  const potBarbearia = potTotal - potStaff;
  const byProf = {};
  entries.forEach(e=>{ byProf[e.appt.professionalId] = (byProf[e.appt.professionalId]||0) + e.fichas; });
  const rows = servingProfessionals().map(p=>{
    const fichas = byProf[p.id] || 0;
    const value = totalFichas>0 ? potStaff*(fichas/totalFichas) : 0;
    return {prof:p, fichas, value};
  }).filter(r=>r.fichas>0);
  return {potTotal, potStaff, potBarbearia, staffPercent, totalFichas, entries, rows};
}
function potCommissionForProf(profId){
  const row = clubFichasBreakdown().rows.find(r=>r.prof.id===profId);
  return row ? row.value : 0;
}
function asaasSummary(){
  const inMonth = state.subscriptionMembers.filter(m=>m.paymentMethod==='asaas');
  const cash = state.subscriptionMembers.filter(m=>m.paymentMethod==='dinheiro');
  const planPrice = m => state.subscriptionPlans.find(p=>p.id===m.planId)?.price || 0;
  return {
    asaasPago: inMonth.filter(m=>m.status==='pago'),
    asaasPendente: inMonth.filter(m=>m.status==='pendente'),
    asaasAtrasado: inMonth.filter(m=>m.status==='atrasado'),
    cashPago: cash.filter(m=>m.status==='pago'),
    cashPendente: cash.filter(m=>m.status!=='pago' && m.status!=='cancelado'),
    // soma apenas o valor que de fato entrou (cobranças pagas), não saldo de conta
    totalRecebidoAsaas: inMonth.filter(m=>m.status==='pago').reduce((a,m)=>a+planPrice(m),0),
    totalRecebidoDinheiro: cash.filter(m=>m.status==='pago').reduce((a,m)=>a+planPrice(m),0),
  };
}

        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6;">Cada profissional entra com um PIN e vê apenas sua própria agenda, clientes e comissões. O dono vê tudo. Este é um controle de visualização simples — para autenticação real e segura, é necessário um backend.</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        <button class="btn ${userSession.role==='dono'?'btn-gold':'btn-ghost'}" style="justify-content:center;" data-set-role="dono">Entrar como Dono / Gerente</button>
      </div>
      <div style="font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Ou entrar como profissional</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${state.professionals.map(p=>`
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="flex:1;font-size:13.5px;">${esc(p.name)} <span style="font-size:11px;color:var(--muted-2);">— ${roleLabel(p.accessRole)}</span></div>
            <input type="password" maxlength="4" placeholder="PIN" data-pin-for="${p.id}" style="width:70px;text-align:center;">
            <button class="btn btn-ghost" style="padding:8px 10px;" data-login-prof="${p.id}">Entrar</button>
          </div>
        `).join('')}
      </div>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('[data-set-role="dono"]').addEventListener('click', ()=>{
      userSession = {role:'dono', professionalId:null};
      closeModal(); render();
    });
    root.querySelectorAll('[data-login-prof]').forEach(b=>b.addEventListener('click', ()=>{
      const profId = b.dataset.loginProf;
      const prof = state.professionals.find(p=>p.id===profId);
      const pin = root.querySelector(`[data-pin-for="${profId}"]`).value;
      if(pin !== prof.pin){ showToast('PIN incorreto.'); return; }
      const accessRole = prof.accessRole || 'profissional';
      userSession = {role: accessRole, professionalId: profId};
      route = 'dashboard';
      closeModal(); render();
      showToast(`Logado como ${prof.name}.`);
    }));
  });
}

function renderView(){
  const view = document.getElementById('view');
  // Trava de segurança: se a rota atual não é permitida para este perfil,
  // volta pro painel (evita acesso direto a telas restritas).
  if(!navAllowedForSession().includes(route)){
    route = 'dashboard';
    return view.innerHTML = viewDashboard();
  }
  if(route==='dashboard') return view.innerHTML = viewDashboard();
  if(route==='agenda') return renderAgenda(view);
  if(route==='caixa') return renderCaixa(view);
  if(route==='comissoes') return renderComissoes(view);
  if(route==='profissionais') return renderProfissionais(view);
  if(route==='servicos') return renderServicos(view);
  if(route==='clube') return renderClube(view);
  if(route==='config') return renderConfig(view);
  if(route==='minha-assinatura') return renderMinhaAssinatura(view);
  if(route==='clientes') return renderClientes(view);
  if(route==='estoque') return renderEstoque(view);
  if(route==='relatorios') return renderRelatorios(view);
  if(route==='fidelidade') return renderFidelidade(view);
  if(route==='agendamento-online') return renderOnlineBooking(view);
  if(route==='mensagens') return renderMensagens(view);
  if(route==='espera') return renderWaitlist(view);
  if(route==='notafiscal') return renderNotaFiscal(view);
  if(route==='configuracoes') return renderConfiguracoes(view);
}

/* ============ DASHBOARD ============ */
function viewDashboard(){
  const isProfView = userSession.role==='profissional';
  const myId = userSession.professionalId;
  const session = openSession();
  const totals = sessionTotals(session);
  // O profissional vê apenas os próprios atendimentos e a própria comissão
  const appts = isProfView
    ? todaysAppointments().filter(a=>a.professionalId===myId)
    : todaysAppointments();
  const done = appts.filter(a=>a.status==='concluido');
  const faturamentoServicos = done.reduce((a,ap)=>a+(serviceById(ap.serviceId)?.price||0),0);
  const commissionsPending = isProfView
    ? commissionOwed(myId).owed
    : state.professionals.reduce((a,p)=>a+commissionOwed(p.id).owed,0);
  const activeMembers = state.subscriptionMembers.filter(m=>m.status==='pago').length;
  const overdueMembers = state.subscriptionMembers.filter(m=>m.status==='atrasado').length;
  const mrr = state.subscriptionMembers.filter(m=>m.status!=='cancelado').reduce((a,m)=>{
    const plan = state.subscriptionPlans.find(p=>p.id===m.planId); return a+(plan?plan.price:0);
  },0);

  return `
    ${pageHeader('Painel', new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'}))}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px;">
      ${statCard(isProfView?'Seu faturamento hoje':'Faturamento em serviços hoje', BRL(faturamentoServicos), `${done.length} atendimento(s) concluído(s)`, 'ok')}
      ${!isProfView ? statCard('Saldo do caixa', session?BRL(totals.balance):'—', session?`Entradas ${BRL(totals.in)} · Saídas ${BRL(totals.out)}`:'Nenhum caixa aberto', session?'ok':'bad') : ''}
      ${statCard(isProfView?'Você tem a receber':'Comissões pendentes', BRL(commissionsPending), isProfView?'em comissões':'a pagar aos profissionais', commissionsPending>0?'warn':'ok')}
      ${!isProfView ? statCard('Clube de assinatura', activeMembers+' membros ativos', 'MRR '+BRL(mrr), 'ok') : ''}
      ${!isProfView ? statCard('Assinantes em atraso', overdueMembers, overdueMembers>0?'precisam de cobrança':'nenhum em atraso', overdueMembers>0?'bad':'ok') : ''}
    </div>

    <div style="display:grid;grid-template-columns:${isProfView?'1fr':'1.4fr 1fr'};gap:16px;align-items:start;" class="dash-grid">
      <div class="card" style="padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div class="font-display" style="font-size:17px;font-weight:600;">Agenda de hoje</div>
          <span class="pill pill-muted">${appts.length} horários</span>
        </div>
        ${appts.length===0 ? emptyState('Nenhum agendamento para hoje.') : `
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${appts.slice(0,6).map(a=>agendaRow(a)).join('')}
          </div>`}
      </div>
      ${!isProfView ? `
      <div class="card" style="padding:20px;">
        <div class="font-display" style="font-size:17px;font-weight:600;margin-bottom:14px;">Comissões por profissional</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${state.professionals.filter(p=>p.servesClients!==false).map(p=>{
            const c = commissionOwed(p.id);
            return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;">
              <span style="color:var(--ink);">${esc(p.name)}</span>
              <span class="font-mono" style="color:${c.owed>0?'var(--warn)':'var(--muted-2)'};">${BRL(c.owed)}</span>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>

    ${overdueMembers>0 && !isProfView ? `
    <div class="card" style="padding:20px;margin-top:16px;border-color:var(--bad);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="font-display" style="font-size:17px;font-weight:600;">${ICON.bell} Assinantes em atraso</div>
        <span class="pill pill-bad">${overdueMembers}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${state.subscriptionMembers.filter(m=>m.status==='atrasado').map(m=>{
          const plan = state.subscriptionPlans.find(p=>p.id===m.planId);
          const text = `Olá ${m.name}! Notamos que sua mensalidade do ${plan?plan.name:'clube'} está em atraso. Pode regularizar quando puder? Qualquer dúvida estamos à disposição.`;
          return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
            <div style="font-size:13.5px;">
              <b>${esc(m.name)}</b> <span style="color:var(--muted-2);font-size:11.5px;">— ${esc(plan?plan.name:'plano removido')} · venceu em ${m.dueDate?new Date(m.dueDate+'T00:00').toLocaleDateString('pt-BR'):'—'}</span>
            </div>
            ${messageChannelRow(m.phone, text)}
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
  `;
}

    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">${label}</div>

/* ============ AGENDA ============ */
/* Agenda em grade: horas na lateral, profissionais em colunas — como um
   quadro de horários de verdade. */
function agendaGridView(dateISO, profList){
  const appts = state.appointments.filter(a=>a.date===dateISO && a.status!=='cancelado');
  // Faixa de horários: cobre a jornada de todos os profissionais do dia
  let minH = 23, maxH = 1;
  profList.forEach(p=>{
    const [sh] = (p.workStart||'09:00').split(':').map(Number);
    const [eh] = (p.workEnd||'19:00').split(':').map(Number);
    minH = Math.min(minH, sh); maxH = Math.max(maxH, eh);
  });
  appts.forEach(a=>{
    const h = parseInt(a.time.split(':')[0]);
    minH = Math.min(minH, h); maxH = Math.max(maxH, h+1);
  });
  if(minH>maxH){ minH = 8; maxH = 20; }
  const hours = [];
  for(let h=minH; h<=maxH; h++) hours.push(h);
  const SLOT_H = 56; // altura de 1 hora, em pixels

  const colFor = (prof)=>{
    const list = appts.filter(a=>a.professionalId===prof.id);
    return list.map(a=>{
      const [h,m] = a.time.split(':').map(Number);
      const svc = serviceById(a.serviceId);
      const dur = svc?.duration || 30;
      const top = ((h - minH) + m/60) * SLOT_H;
      const height = Math.max(26, (dur/60) * SLOT_H - 3);
      const done = a.status==='concluido';
      return `<div title="${esc(a.client)} — ${esc(svc?svc.name:'')}" style="position:absolute;left:3px;right:3px;top:${top}px;height:${height}px;background:${done?'var(--ok-bg)':'var(--panel-2)'};border:1px solid ${done?'var(--ok)':'var(--gold)'};border-left:3px solid ${done?'var(--ok)':'var(--gold)'};border-radius:7px;padding:5px 8px;overflow:hidden;cursor:default;">
        <div class="font-mono" style="font-size:10px;color:var(--muted-2);">${a.time}${svc?` · ${dur}min`:''}</div>
        <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(a.client)} ${clubStarBadge(a.client)}</div>
        ${height>44 && svc?`<div style="font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(svc.name)}</div>`:''}
      </div>`;
    }).join('');
  };

  return `
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:20px;">
      <div style="min-width:${120 + profList.length*170}px;">
        <div style="display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2;">
          <div style="width:60px;flex-shrink:0;"></div>
          ${profList.map(p=>`
            <div style="flex:1;min-width:170px;padding:12px 10px;display:flex;align-items:center;gap:9px;border-left:1px solid var(--border);">
              <div style="width:34px;height:34px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted-2);">
                ${p.photoDataUrl ? `<img src="${p.photoDataUrl}" style="width:100%;height:100%;object-fit:cover;">` : ICON.team}
              </div>
              <div style="min-width:0;">
                <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
                <div style="font-size:10.5px;color:var(--muted-2);">${isProfessionalWorking(p, dateISO)?`${p.workStart}–${p.workEnd}`:'Folga'}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;position:relative;">
          <div style="width:60px;flex-shrink:0;">
            ${hours.map(h=>`<div style="height:${SLOT_H}px;border-bottom:1px solid var(--border);padding:4px 8px;" class="font-mono">
              <span style="font-size:11px;color:var(--muted-2);">${String(h).padStart(2,'0')}:00</span>
            </div>`).join('')}
          </div>
          ${profList.map(p=>`
            <div style="flex:1;min-width:170px;position:relative;border-left:1px solid var(--border);background:${isProfessionalWorking(p, dateISO)?'transparent':'repeating-linear-gradient(45deg, transparent, transparent 8px, var(--panel-2) 8px, var(--panel-2) 16px)'};">
              ${hours.map(h=>`
                <div style="height:${SLOT_H}px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;">
                  <div class="grid-slot" data-prof="${p.id}" data-time="${String(h).padStart(2,'0')}:00" style="flex:1;cursor:pointer;"></div>
                  <div class="grid-slot" data-prof="${p.id}" data-time="${String(h).padStart(2,'0')}:30" style="flex:1;cursor:pointer;border-top:1px dashed var(--border);"></div>
                </div>
              `).join('')}
              ${colFor(p)}
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderAgenda(view){
  autoExpireUnpaidDeposits();
  const isProfView = userSession.role==='profissional';
  const myId = userSession.professionalId;
  if(!agendaDate) agendaDate = todayISO();
  const viewDate = agendaDate;
  const isToday = viewDate === todayISO();
  let appts = state.appointments.filter(a=>a.date===viewDate).sort((a,b)=>a.time.localeCompare(b.time));
  if(isProfView) appts = appts.filter(a=>a.professionalId===myId);

  // Dias da semana em que a data selecionada está
  const sel = new Date(viewDate+'T12:00');
  const dow = (sel.getDay()+6)%7; // 0 = segunda
  const monday = new Date(sel); monday.setDate(sel.getDate()-dow);
  const weekDays = Array.from({length:7}, (_,i)=>{
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    return d.toISOString().slice(0,10);
  });
  const shiftWeek = (delta)=>{
    const d = new Date(viewDate+'T12:00'); d.setDate(d.getDate()+delta*7);
    return d.toISOString().slice(0,10);
  };
  const dayLabel = new Date(viewDate+'T12:00').toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
  const doneCount = appts.filter(a=>a.status==='concluido').length;
  const revenue = appts.filter(a=>a.status==='concluido').reduce((t,a)=>{ const s=serviceById(a.serviceId); return t+(s?s.price:0); },0);

  view.innerHTML = `
    ${pageHeader('Agenda', dayLabel.charAt(0).toUpperCase()+dayLabel.slice(1), `<button class="btn btn-gold" id="btn-new-appt">${ICON.plus} Novo agendamento</button>`)}

    <div class="card" style="padding:14px 16px;margin-bottom:18px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="btn btn-ghost" id="wk-prev" style="padding:7px 11px;">‹ Semana anterior</button>

        <button class="btn btn-ghost" id="wk-next" style="padding:7px 11px;">Próxima semana ›</button>
        <div style="flex:1;"></div>
        <input type="date" id="wk-picker" value="${viewDate}" style="padding:7px 10px;">
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">
        ${weekDays.map(d=>{
          const dd = new Date(d+'T12:00');
          const count = state.appointments.filter(a=>a.date===d && (!isProfView || a.professionalId===myId) && a.status!=='cancelado').length;
          const selected = d===viewDate;
          const today = d===todayISO();
          return `<button class="btn btn-ghost wk-day" data-day="${d}" style="flex-direction:column;gap:2px;padding:9px 4px;${selected?'background:var(--gold);color:#1a1610;border-color:var(--gold);':today?'border-color:var(--gold);':''}">
            <span style="font-size:10px;text-transform:uppercase;opacity:.75;">${['seg','ter','qua','qui','sex','sáb','dom'][(dd.getDay()+6)%7]}</span>
            <span style="font-size:15px;font-weight:600;">${String(dd.getDate()).padStart(2,'0')}</span>
            <span style="font-size:9.5px;opacity:.75;">${count>0?count+(count===1?' hor.':' hor.'):'—'}</span>
          </button>`;
        }).join('')}

function autoExpireUnpaidDeposits(){
  const expired = expiredDepositAppointments();
  if(expired.length===0) return;
  update(s=>{
    expired.forEach(a=>{
      const appt = s.appointments.find(x=>x.id===a.id);
      if(appt){ appt.status='cancelado'; appt.depositStatus='pendente'; }
    });
  });
}
function cancelAppointment(id, newStatus){
  let freed = null;
  update(s=>{
    const appt = s.appointments.find(a=>a.id===id);
    appt.status = newStatus;
    freed = {date:appt.date, time:appt.time, professionalId:appt.professionalId};
  });
  const match = tryFillFromWaitlist(freed.date, freed.time, freed.professionalId);
  if(match){
    showToast(`${newStatus==='faltou'?'Falta registrada':'Cancelado'}. ${match.clientName} está na lista de espera para esse horário — avise-o em Lista de Espera.`);
  }else{
    showToast(newStatus==='faltou' ? 'Falta registrada.' : 'Agendamento cancelado.');
  }
}

function concludeAppt(id){
  const session = openSession();
  if(!session){ showToast('Abra o caixa antes de concluir atendimentos.'); route='caixa'; render(); return; }
  const appt = state.appointments.find(a=>a.id===id);
  const service = serviceById(appt.serviceId);
  if(!service){ showToast('Serviço não encontrado.'); return; }

  // Calcula o valor considerando o clube de assinatura
  const member = state.subscriptionMembers.find(m=>m.name.trim().toLowerCase()===appt.client.trim().toLowerCase());
  let basePrice = service.price;
  let priceNote = '';
  if(member && member.status==='pago'){
    const plan = state.subscriptionPlans.find(p=>p.id===member.planId);
    // O plano só vale nos dias marcados no cadastro dele
    if(plan && !planValidOnDate(plan, appt.date)){
      priceNote = ` (${planDaysLabel(plan.validDays).toLowerCase()} — hoje não vale, valor cheio)`;
    } else if(plan && plan.includedServiceIds && plan.includedServiceIds.includes(service.id)){
      basePrice = 0; priceNote = ' (incluso no clube)';
    } else if(plan && plan.discountPercent>0){
      basePrice = service.price * (1 - plan.discountPercent/100);
      priceNote = ` (${plan.discountPercent}% desconto clube)`;
    }
  } else if(member && member.status==='atrasado'){
    priceNote = ' (clube em atraso — valor cheio)';
  }
  const netAmount = appt.depositStatus==='pago' ? Math.max(0, basePrice - appt.depositAmount) : basePrice;

  const finish = (method)=>{
    update(s=>{
      const ap = s.appointments.find(a=>a.id===id);
      ap.status='concluido';
      ap.paymentMethod = method;
      const sess = s.cashSessions.find(c=>c.status==='aberto');
      sess.entries.push({id:uid(), type:'entrada', method, desc:`${service.name} — ${ap.client}${priceNote}${ap.depositStatus==='pago'?' (saldo, sinal já recebido)':''}`, amount:netAmount, time:new Date().toTimeString().slice(0,5), auto:true});
      const client = s.clients.find(c=>c.name.trim().toLowerCase()===ap.client.trim().toLowerCase());
      if(client) maybeAwardReferral(client);
    });
    closeModal();
    showToast(`Atendimento concluído — ${BRL(netAmount)} em ${methodLabelPay(method)}.`);
  };

  if(netAmount<=0){ finish('dinheiro'); return; }

  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">Concluir atendimento</div>
        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">${esc(appt.client)} · ${esc(service.name)}${priceNote}</div>
      <div class="font-mono" style="font-size:26px;color:var(--gold-bright);margin-bottom:18px;">${BRL(netAmount)}</div>
      <label>Forma de pagamento</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
        ${PAYMENT_METHODS.map(m=>`<button class="btn btn-ghost pay-method" data-method="${m.id}" style="justify-content:center;padding:14px 10px;font-size:13.5px;">${m.label}</button>`).join('')}
      </div>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelectorAll('.pay-method').forEach(b=>b.addEventListener('click', ()=>finish(b.dataset.method)));
  });
}

          const diff = (h.closingCounted ?? t.balance) - t.balance;
          return `<tr>
            <td>${new Date(h.date+'T00:00').toLocaleDateString('pt-BR')}</td>
            <td class="font-mono">${BRL(h.openingAmount)}</td>
            <td class="font-mono" style="color:var(--ok);">${BRL(t.in)}</td>

            <td class="font-mono">${BRL(t.balance)}</td>
            <td class="font-mono">${h.closingCounted!=null?BRL(h.closingCounted):'—'}</td>
            <td class="font-mono" style="color:${diff===0?'var(--muted)':diff>0?'var(--ok)':'var(--bad)'};">${diff===0?'—':(diff>0?'+':'')+BRL(diff)}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    `}
  `;

  view.querySelector('#btn-open-cash')?.addEventListener('click', openCashModal);
  view.querySelector('#btn-close-cash')?.addEventListener('click', closeCashModal);
  view.querySelector('#btn-add-in')?.addEventListener('click', ()=>addEntryModal('entrada'));
  view.querySelector('#btn-add-out')?.addEventListener('click', ()=>addEntryModal('saida'));
}
function openCashModal(){

    root.querySelector('#m-close').addEventListener('click', closeModal);

      const val = parseFloat(root.querySelector('#f-open').value);
      if(isNaN(val) || val<0){ showToast('Informe um valor válido.'); return; }
      update(s=>{
        s.cashSessions.push({id:uid(), date:todayISO(), status:'aberto', openingAmount:val, openedAt:new Date().toISOString(), closedAt:null, closingCounted:null, entries:[]});
      });
      closeModal();
      showToast('Caixa aberto.');
    });
  });

function closeCashModal(){

  const totals = sessionTotals(session);
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">Fechar caixa</div>

        Entradas: <span class="font-mono" style="color:var(--ok);">${BRL(totals.in)}</span><br>
        Saídas: <span class="font-mono" style="color:var(--bad);">${BRL(totals.out)}</span><br>

      </div>
      <label>Valor contado no caixa</label>
      <input id="f-count" type="number" step="0.01" min="0" placeholder="0,00" style="width:100%;margin-bottom:16px;">

    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#f-submit').addEventListener('click', ()=>{
      const val = parseFloat(root.querySelector('#f-count').value);
      if(isNaN(val) || val<0){ showToast('Informe o valor contado.'); return; }
      update(s=>{
        const sess = s.cashSessions.find(c=>c.status==='aberto');

function addEntryModal(type){
  const isIn = type==='entrada';
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">Lançar ${isIn?'entrada':'saída'}</div>
        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">

        <div><label>Forma de pagamento</label><select id="f-method" style="width:100%;">
          ${PAYMENT_METHODS.map(m=>`<option value="${m.id}">${m.label}</option>`).join('')}
        </select>

        <button class="btn btn-gold" id="f-submit" style="justify-content:center;margin-top:4px;">Lançar</button>
      </div>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#f-submit').addEventListener('click', ()=>{
      const desc = root.querySelector('#f-desc').value.trim();
      const amount = parseFloat(root.querySelector('#f-amount').value);
      const method = root.querySelector('#f-method').value;
      if(!desc || isNaN(amount) || amount<=0){ showToast('Preencha descrição e valor.'); return; }
      update(s=>{
        s.cashSessions.find(c=>c.status==='aberto').entries.push({id:uid(), type, method, desc, amount, time:new Date().toTimeString().slice(0,5), auto:false});
      });
      closeModal();
    });
  });

  return `${meses[parseInt(m)-1]}/${y}`;
}

const WEEKDAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WEEKDAY_FULL = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
// Monta a frase de validade do plano a partir dos dias marcados.
// Ex: [1,2,3,4] -> "Válido de segunda a quinta" | todos -> "Válido a semana toda"
function planDaysLabel(days){
  if(!Array.isArray(days) || days.length===0) return '';
  const set = [...new Set(days)].sort((a,b)=>a-b);
  if(set.length===7) return 'Válido a semana toda';
  // ordem da semana começando na segunda (1..6, depois 0=domingo)
  const ordem = [1,2,3,4,5,6,0];
  const idx = set.map(d=>ordem.indexOf(d)).sort((a,b)=>a-b);
  const sequencial = idx.every((v,i)=> i===0 || v === idx[i-1]+1);
  if(sequencial && set.length>=2){
    const ini = WEEKDAY_FULL[ordem[idx[0]]];
    const fim = WEEKDAY_FULL[ordem[idx[idx.length-1]]];
    return `Válido de ${ini} a ${fim}`;
  }
  if(set.length===1) return `Válido apenas às ${WEEKDAY_FULL[set[0]]}s`;
  const nomes = idx.map(i=>WEEKDAY_FULL[ordem[i]]+'s');
  return `Válido às ${nomes.slice(0,-1).join(', ')} e ${nomes[nomes.length-1]}`;
}
// O plano vale nesta data? (sem dias marcados = vale todos os dias)
function planValidOnDate(plan, dateISO){
  if(!plan || !Array.isArray(plan.validDays) || plan.validDays.length===0) return true;
  return plan.validDays.includes(new Date(dateISO+'T12:00').getDay());
}

      chip.addEventListener('click', ()=>{ currentTimeOff = currentTimeOff.filter(x=>x!==d); chip.remove(); });
      root.querySelector('#timeoff-list').appendChild(chip);
    });
    root.querySelectorAll('[data-timeoff-chip]').forEach(chip=>{
      chip.style.cursor='pointer';
      chip.addEventListener('click', ()=>{ currentTimeOff = currentTimeOff.filter(x=>x!==chip.dataset.timeoffChip); chip.remove(); });
    });
    root.querySelector('#f-submit').addEventListener('click', ()=>{
      const name = root.querySelector('#f-name').value.trim();
      const phone = root.querySelector('#f-phone').value.trim();
      const accessRole = root.querySelector('#f-access-role').value;
      const commission = parseFloat(root.querySelector('#f-comm').value)||0;
      const pin = root.querySelector('#f-pin').value.trim() || '0000';
      const selectedDays = [...root.querySelectorAll('[data-workday]:checked')].map(el=>parseInt(el.dataset.workday));
      const workStart = root.querySelector('#f-start').value;
      const workEnd = root.querySelector('#f-end').value;
      const serviceOverrides = {};
      root.querySelectorAll('[data-override]').forEach(inp=>{
        if(inp.value!=='') serviceOverrides[inp.dataset.override] = parseFloat(inp.value);
      });
      if(!name){ showToast('Informe o nome.'); return; }
      const servesClients = root.querySelector('#f-serves').checked;
      const data = {name, phone, accessRole, commission, pin, servesClients, photoDataUrl: currentPhoto, workDays:selectedDays, workStart, workEnd, timeOff:currentTimeOff, serviceOverrides};
      update(s=>{
        if(isEdit){ Object.assign(existing, data); }
        else{ s.professionals.push({id:uid(), ...data}); }
      });
      closeModal();
    });
  });
}

      </div>

let asaasImportData = null;
function confirmAsaasImport(view){
  if(!asaasImportData) return;
  const { members, plans } = asaasImportData;
  let planos=0, novos=0, atualizados=0;
  update(s=>{
    // cria os planos que ainda não existem, guardando o mapeamento
    const keyToPlanId = {};
    plans.forEach(p=>{
      const existente = s.subscriptionPlans.find(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase() && Number(x.price)===Number(p.price));
      if(existente){ keyToPlanId[p.key] = existente.id; return; }
      const id = uid();
      s.subscriptionPlans.push({id, name:p.name, category:'Importado do Asaas', price:p.price, discountPercent:0, includedServiceIds:[], benefits:''});
      keyToPlanId[p.key] = id;
      planos++;
    });
    // cria/atualiza os assinantes
    members.forEach(m=>{
      const existente = s.subscriptionMembers.find(x=>x.asaasSubscriptionId===m.asaasSubscriptionId);
      const dados = {
        name:m.name, phone:m.phone, planId:keyToPlanId[m.planKey],
        paymentMethod:'asaas', dueDate:m.dueDate, status:m.status,
        asaasSubscriptionId:m.asaasSubscriptionId, asaasCustomerId:m.asaasCustomerId,
      };
      if(existente){ Object.assign(existente, dados); atualizados++; }
      else { s.subscriptionMembers.push({id:uid(), asaasChargeId:'', invoiceUrl:'', lastPaymentDate:null, lastPaymentAmount:0, ...dados}); novos++; }
    });
  });
  asaasImportData = null;
  showToast(`Importado: ${novos} assinante(s) novo(s), ${atualizados} atualizado(s), ${planos} plano(s) criado(s).`);
  renderConfig(view);
}
async function syncAsaas(){
  if(!state.asaas.apiKey){
    showToast('Configure sua API Key do Asaas em Integração Asaas antes de sincronizar.');
    return;
  }
  showToast('Sincronizando com o Asaas...');
  const { data: result, error } = await supa.functions.invoke('asaas-sync', { body: { action:'sync_status' } });
  if(error){ showToast('Falha ao chamar o servidor: '+(error.message||'erro desconhecido')); return; }
  if(result?.error){ showToast(result.error); return; }
  if(result?.note){ showToast(result.note); return; }
  update(s=>{
    (result.results||[]).forEach(r=>{
      const m = s.subscriptionMembers.find(x=>x.id===r.memberId);
      if(m){
        m.status = r.status;
        m.lastPaymentDate = r.lastPaymentDate;
        m.lastPaymentAmount = r.lastPaymentAmount;
        if(r.invoiceUrl) m.invoiceUrl = r.invoiceUrl;
      }
    });
  });
  showToast(`Sincronizado — ${(result.results||[]).length} assinante(s) atualizados.`);
}

function renderMinhaAssinatura(view){
  const shop = currentShop;
  const limits = planLimits(shop);
  const statusInfo = {
    trialing: {label:'Em teste grátis', tone:'warn'},
    active: {label:'Ativa', tone:'ok'},
    past_due: {label:'Pagamento atrasado', tone:'bad'},
    canceled: {label:'Cancelada', tone:'bad'},
  }[shop.subscription_status] || {label: shop.subscription_status, tone:'muted'};

  let periodInfo = '';
  if(shop.subscription_status==='trialing' && shop.trial_ends_at){
    const daysLeft = Math.max(0, Math.ceil((new Date(shop.trial_ends_at) - new Date())/86400000));
    periodInfo = `Seu teste grátis termina em ${new Date(shop.trial_ends_at).toLocaleDateString('pt-BR')} (${daysLeft} dia(s) restante(s)).`;
  } else if(shop.subscription_status==='active' && shop.current_period_end){
    const daysLeft = Math.max(0, Math.ceil((new Date(shop.current_period_end) - new Date())/86400000));
    periodInfo = `Próxima renovação em ${new Date(shop.current_period_end).toLocaleDateString('pt-BR')} (${daysLeft} dia(s)). Se o pagamento falhar nessa data, a assinatura passa para "Pagamento atrasado".`;
  } else if(shop.subscription_status==='past_due'){
    periodInfo = 'Houve um problema com o último pagamento. Regularize pelo botão abaixo para não perder o acesso.';
  } else if(shop.subscription_status==='canceled'){
    periodInfo = 'Sua assinatura foi cancelada. Assine novamente para recuperar o acesso.';
  }

  view.innerHTML = `
    ${pageHeader('Configurações da Conta', 'Seu perfil de acesso e os dados da sua assinatura do sistema')}

    <div class="card" style="padding:22px;margin-bottom:20px;max-width:560px;">

/* ============ CLIENTES (CRM) ============ */
function clientsToCSV(){
  const header = ['Nome','Telefone','Aniversario(DD/MM)','Pontos','Observacoes'];
  const rows = state.clients.map(c=>[
    c.name||'', c.phone||'', c.birthday?c.birthday.split('-').reverse().join('/'):'', c.points||0, c.notes||''
  ]);
  const escape = v => {
    const s = String(v).replace(/"/g,'""');
    return /[;,"\n]/.test(s) ? `"${s}"` : s;
  };
  return [header, ...rows].map(r=>r.map(escape).join(';')).join('\n');
}
function downloadCSV(){
  const csv = '\uFEFF' + clientsToCSV();
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `clientes-primer-barber-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Exportação gerada.');
}
function parseCSVLine(line, delim){
  const out = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; } }
      else cur+=ch;
    }else{
      if(ch==='"') inQuotes=true;
      else if(ch===delim){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(v=>v.trim());
}
/* Lê um arquivo (.xlsx, .xls ou .csv) e devolve as linhas como matriz. */
function readSpreadsheetFile(file, onRows){
  const isExcel = /\.(xlsx|xls|xlsm)$/i.test(file.name);
  const reader = new FileReader();
  reader.onerror = () => showToast('Não foi possível ler o arquivo.');
  reader.onload = () => {
    try{
      if(isExcel){
        if(typeof XLSX==='undefined'){ showToast('Leitor de Excel não carregou. Verifique sua conexão e recarregue a página.'); return; }
        const wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, blankrows:false, defval:''});
        onRows(rows.map(r=>r.map(cell=>String(cell??'').trim())));
      } else {
        const text = reader.result;
        const lines = String(text).split(/\r?\n/).filter(l=>l.trim().length>0);
        if(lines.length===0){ showToast('Arquivo vazio.'); return; }
        const delim = lines[0].includes(';') ? ';' : ',';
        onRows(lines.map(l=>parseCSVLine(l, delim)));
      }
    }catch(err){
      console.error(err);
      showToast('Não foi possível interpretar o arquivo. Verifique o formato.');
    }
  };
  if(isExcel) reader.readAsArrayBuffer(file);
  else reader.readAsText(file, 'UTF-8');
}

/* Acha em qual coluna está cada informação, lendo o cabeçalho da planilha.
   Assim funciona com qualquer formato de exportação, em qualquer ordem. */
function mapColumns(headerRow, mapping){
  const norm = s => String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const header = headerRow.map(norm);
  const found = {};
  Object.entries(mapping).forEach(([key, aliases])=>{
    let idx = -1;
    // Testa os apelidos na ordem de prioridade: o primeiro da lista vence.
    // Assim "Telefone" ganha de "Zap" quando as duas colunas existem.
    for(const a of aliases){
      const exact = header.findIndex(h => h === a);
      if(exact >= 0){ idx = exact; break; }
      const partial = header.findIndex(h => h && h.includes(a));
      if(partial >= 0){ idx = partial; break; }
    }
    found[key] = idx;
  });
  return found;
}
function cellValue(row, idx){
  if(idx==null || idx < 0) return '';
  let v = row[idx];
  if(v==null) return '';
  v = String(v).trim();
  // Excel às vezes guarda telefone/número como 5522981296800.0
  if(/^\d+\.0$/.test(v)) v = v.slice(0,-2);
  return v;
}

function importClientsFromRows(rows){
  if(!rows || rows.length===0){ showToast('Arquivo vazio.'); return; }

  // Procura a linha de cabeçalho (a primeira que tenha uma coluna "nome")
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  let headerIdx = rows.findIndex(r => r.some(c => norm(c)==='nome' || norm(c)==='cliente' || norm(c)==='nome do cliente'));
  if(headerIdx === -1) headerIdx = 0;

  const cols = mapColumns(rows[headerIdx], {
    name:     ['nome do cliente','nome','cliente'],
    phone:    ['telefone','celular','whatsapp','zap','fone','contato'],
    birthday: ['aniversario','nascimento','data de nascimento'],
    points:   ['pontos','moedas','fidelidade'],
    notes:    ['observacoes','observacao','obs','tags','anotacoes'],
  });

  if(cols.name < 0){
    showToast('Não encontrei uma coluna "Nome" na planilha. Verifique o cabeçalho.');
    return;
  }

  const dataRows = rows.slice(headerIdx+1);
  let added=0, updated=0, skipped=0;
  update(s=>{
    dataRows.forEach(r=>{
      const name = cellValue(r, cols.name);
      if(!name){ skipped++; return; }
      const phone = cellValue(r, cols.phone);
      const birthdayRaw = cellValue(r, cols.birthday);
      const pointsRaw = cellValue(r, cols.points);
      const notes = cellValue(r, cols.notes);

      let birthday = '';
      const m = birthdayRaw.match(/^(\d{1,2})[\/\-](\d{1,2})/);
      if(m) birthday = m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
      const points = parseInt(pointsRaw)||0;

      const existing = s.clients.find(c=>c.name.trim().toLowerCase()===name.toLowerCase());
      if(existing){
        Object.assign(existing, {
          phone: phone||existing.phone,
          birthday: birthday||existing.birthday,
          points: pointsRaw ? points : existing.points,
          notes: notes||existing.notes,
        });
        updated++;
      }else{
        s.clients.push({id:uid(), name, phone, birthday, points, notes});
        added++;
      }
    });
  });
  showToast(`Importação concluída: ${added} novo(s), ${updated} atualizado(s)${skipped?`, ${skipped} linha(s) sem nome ignorada(s)`:''}.`);
}

function importServicesFromRows(rows){
  if(!rows || rows.length===0){ showToast('Arquivo vazio.'); return; }
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  let headerIdx = rows.findIndex(r => r.some(c => ['nome','servico','serviço','descricao'].includes(norm(c))));
  if(headerIdx === -1) headerIdx = 0;

  const cols = mapColumns(rows[headerIdx], {
    name:     ['nome do servico','servico','nome','descricao'],
    price:    ['valor','preco','preço'],
    duration: ['duracao','duração','tempo','minutos'],
    fichas:   ['ficha','fichas','clube'],
  });

  if(cols.name < 0){
    showToast('Não encontrei uma coluna com o nome do serviço. Verifique o cabeçalho.');
    return;
  }

  const dataRows = rows.slice(headerIdx+1);
  let added=0, updated=0;
  update(s=>{
    dataRows.forEach(r=>{
      const name = cellValue(r, cols.name);
      if(!name) return;
      const priceRaw = cellValue(r, cols.price);
      const durationRaw = cellValue(r, cols.duration);
      const fichasRaw = cellValue(r, cols.fichas);
      const price = parseFloat(priceRaw.replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
      const duration = parseInt(durationRaw) || 30;
      const clubFichas = parseInt(fichasRaw) || 0;

      const existing = s.services.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
      if(existing){
        Object.assign(existing, {
          price: priceRaw ? price : existing.price,
          duration: durationRaw ? duration : existing.duration,
          clubFichas: fichasRaw ? clubFichas : existing.clubFichas,
        });
        updated++;
      }else{
        s.services.push({id:uid(), name, price, duration, requireDeposit:false, depositType:'percentual', depositValue:30, clubFichas});
        added++;
      }
    });
  });
  showToast(`Importação concluída: ${added} novo(s), ${updated} atualizado(s).`);
}

function sellProductModal(prod){
  if(!prod) return;
  if(!openSession()){ showToast('Abra o caixa antes de registrar vendas.'); route='caixa'; render(); return; }
  const clientes = state.clients.slice().sort((a,b)=>a.name.localeCompare(b.name));
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">Vender produto</div>
        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">${esc(prod.name)} · ${prod.stock} em estoque</div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div><label>Quantidade</label><input id="sp-qty" type="number" min="1" max="${prod.stock}" value="1" style="width:100%;"></div>
        <div><label>Cliente (opcional — para aplicar desconto do clube)</label>
          <select id="sp-client" style="width:100%;">
            <option value="">Sem cliente identificado</option>
            ${clientes.map(cl=>`<option value="${esc(cl.name)}">${esc(cl.name)}</option>`).join('')}
          </select>
        </div>
        <div id="sp-total" class="card" style="padding:14px 16px;background:var(--panel-2);"></div>
        <label>Forma de pagamento</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${PAYMENT_METHODS.map(m=>`<button class="btn btn-ghost sp-pay" data-method="${m.id}" style="justify-content:center;padding:13px 10px;font-size:13px;">${m.label}</button>`).join('')}
        </div>
      </div>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    const calc = ()=>{
      const qty = Math.max(1, Math.min(prod.stock, parseInt(root.querySelector('#sp-qty').value)||1));
      const nome = root.querySelector('#sp-client').value;
      const bruto = prod.price * qty;
      let desconto = 0, nota = '';
      const m = nome ? clubMemberForClient(nome) : null;
      if(m && m.status==='pago'){
        const plan = state.subscriptionPlans.find(p=>p.id===m.planId);
        if(plan && !planValidOnDate(plan, todayISO())){
          nota = `${planDaysLabel(plan.validDays)} — hoje o desconto não vale.`;
        } else if(plan && plan.discountPercent>0){
          desconto = bruto * (plan.discountPercent/100);
          nota = `Desconto de assinante: ${plan.discountPercent}% (${esc(plan.name)})`;
        }
      } else if(m && m.status==='atrasado'){
        nota = 'Assinante em atraso — sem desconto.';
      }
      const total = bruto - desconto;
      root.querySelector('#sp-total').innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);"><span>${qty}× ${esc(prod.name)}</span><span class="font-mono">${BRL(bruto)}</span></div>
        ${desconto>0?`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ok);margin-top:5px;"><span>Desconto</span><span class="font-mono">− ${BRL(desconto)}</span></div>`:''}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
          <span style="font-size:13px;font-weight:600;">Total</span>
          <span class="font-mono" style="font-size:21px;color:var(--gold-bright);">${BRL(total)}</span>
        </div>
        ${nota?`<div style="font-size:11.5px;color:var(--muted-2);margin-top:8px;">${nota}</div>`:''}
      `;
      return {qty, total, nome, desconto};
    };
    root.querySelector('#sp-qty').addEventListener('input', calc);
    root.querySelector('#sp-client').addEventListener('change', calc);
    calc();
    root.querySelectorAll('.sp-pay').forEach(b=>b.addEventListener('click', ()=>{
      const {qty, total, nome, desconto} = calc();
      const method = b.dataset.method;
      update(s=>{
        const p = s.products.find(x=>x.id===prod.id);
        p.stock = Math.max(0, p.stock - qty);
        const sess = s.cashSessions.find(x=>x.status==='aberto');
        sess.entries.push({
          id:uid(), type:'entrada', method,
          desc:`${qty}× ${prod.name}${nome?' — '+nome:''}${desconto>0?' (com desconto do clube)':''}`,
          amount: total, time:new Date().toTimeString().slice(0,5), auto:false,
        });
      });
      closeModal();
      showToast(`Venda registrada — ${BRL(total)} em ${methodLabelPay(method)}.`);
    }));
  });
}

async function acceptBookingRequest(req){
  update(s=>{
    s.appointments.push({id:uid(), date:req.date, time:req.time, professionalId:req.professional_id, serviceId:req.service_id, client:req.client_name, status:'agendado', confirmed:false, depositStatus:'nao_aplicavel', depositAmount:0, createdAt:new Date().toISOString(), rating:null});
  });
  await supa.from('booking_requests').update({status:'aceito'}).eq('id', req.id);
  showToast('Agendamento aceito e adicionado à agenda.');
  await refreshNotifItems();
}
async function declineBookingRequest(id){
  await supa.from('booking_requests').update({status:'recusado'}).eq('id', id);
  showToast('Pedido recusado.');
  await refreshNotifItems();
}

async function loadBookingRequests(view){
  const listEl = view.querySelector('#pb-requests-list');
  const countEl = view.querySelector('#pb-pending-count');
  if(!listEl || !currentShop) return;
  const { data, error } = await supa.from('booking_requests').select('*').eq('shop_id', currentShop.id).eq('status','pendente').order('created_at',{ascending:false});
  if(error){ listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">Não foi possível carregar.</div>'; return; }
  countEl.textContent = (data||[]).length + ' pendente(s)';
  if(!data || !data.length){ listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">Nenhum pedido pendente.</div>'; return; }
  listEl.innerHTML = data.map(r=>`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="font-size:13px;">
        <b>${esc(r.client_name)}</b> — ${esc(r.service_name)} com ${esc(r.professional_name)}<br>
        <span style="color:var(--muted);font-size:11.5px;">${esc(r.date)} às ${esc(r.time)} · ${esc(r.client_phone)}</span>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn btn-gold" data-accept="${r.id}" style="padding:6px 10px;font-size:12px;">Aceitar</button>
        <button class="btn btn-ghost" data-decline="${r.id}" style="padding:6px 10px;font-size:12px;">Recusar</button>
      </div>
    </div>
  `).join('');
  listEl.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click', async ()=>{
    const req = data.find(r=>r.id===b.dataset.accept);
    await acceptBookingRequest(req);
    loadBookingRequests(view);
  }));
  listEl.querySelectorAll('[data-decline]').forEach(b=>b.addEventListener('click', async ()=>{
    await declineBookingRequest(b.dataset.decline);
    loadBookingRequests(view);
  }));
}

/* ============ SININHO DE NOTIFICAÇÕES (novos agendamentos em tempo real) ============ */
async function refreshNotifItems(){
  if(!supa || !currentShop) return;
  const { data } = await supa.from('booking_requests').select('*').eq('shop_id', currentShop.id).eq('status','pendente').order('created_at',{ascending:false});
  notifState.items = data || [];
  renderNotifUI();
}
function subscribeBookingNotifications(){
  if(!supa || !currentShop || notifState.channel) return;
  notifState.channel = supa.channel('booking-notify-'+currentShop.id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'booking_requests', filter:`shop_id=eq.${currentShop.id}`}, payload=>{
      notifState.items.unshift(payload.new);
      showToast(`Novo agendamento: ${payload.new.client_name} — ${payload.new.date} às ${payload.new.time}`);
      renderNotifUI();
    })
    .subscribe();
}
function renderNotifUI(){
  const badge = document.getElementById('notif-badge');
  const bell = document.getElementById('btn-notif-bell');
  if(bell){
    const count = notifState.items.length;
    let b = document.getElementById('notif-badge');
    if(count>0){
      if(!b){ b = document.createElement('span'); b.id='notif-badge'; b.style.cssText='position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;'; bell.appendChild(b); }
      b.textContent = count>9?'9+':String(count);
    } else if(b){ b.remove(); }
  }
  const dropdown = document.getElementById('notif-dropdown');
  if(dropdown && notifState.open) dropdown.innerHTML = notifDropdownContent();
}
function notifDropdownContent(){
  if(!notifState.items.length) return `<div style="padding:16px;font-size:12.5px;color:var(--muted);text-align:center;">Nenhum agendamento novo.</div>`;
  return notifState.items.map(r=>`
    <div style="padding:10px 12px;border-bottom:1px solid var(--border);">
      <div style="font-size:13px;"><b>${esc(r.client_name)}</b> agendou</div>
      <div style="font-size:12px;color:var(--muted);margin:2px 0 8px;">${esc(r.service_name)} com ${esc(r.professional_name)} · ${new Date(r.date+'T'+r.time).toLocaleDateString('pt-BR')} às ${esc(r.time)}</div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-gold" data-notif-accept="${r.id}" style="padding:5px 10px;font-size:11.5px;">Aceitar</button>
        <button class="btn btn-ghost" data-notif-decline="${r.id}" style="padding:5px 10px;font-size:11.5px;">Recusar</button>
      </div>
    </div>
  `).join('');
}

function readImageAsDataURL(file, maxBytes, cb){
  if(file.size > maxBytes){
    showToast(`Imagem muito grande (máx. ${Math.round(maxBytes/1024)}KB). Escolha uma menor ou comprima antes.`);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => cb(reader.result);
  reader.onerror = () => showToast('Não foi possível ler a imagem.');
  reader.readAsDataURL(file);
}

async function loadPublicSlots(){
  const wrap = document.getElementById('pb-slots-wrap');
  const prof = (pubBooking.info.professionals||[]).find(p=>p.id===pubBooking.professionalId);
  if(!wrap || !prof) return;
  wrap.innerHTML = `<div style="font-size:12px;color:var(--muted);">Carregando horários...</div>`;
  const { data: booked } = await supa.rpc('get_booked_times', { p_shop_id: pubBooking.shopId, p_professional_id: prof.id, p_date: pubBooking.date });
  const bookedSet = new Set(booked || []);
  const slots = [];
  let [h,m] = (prof.workStart||'09:00').split(':').map(Number);
  const [endH,endM] = (prof.workEnd||'18:00').split(':').map(Number);
  while(h < endH || (h===endH && m < endM)){
    const t = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    if(!bookedSet.has(t)) slots.push(t);
    m += 30; if(m>=60){m=0;h++;}
  }
  wrap.innerHTML = `
    <div style="font-size:13px;font-weight:600;margin-bottom:10px;">Horários disponíveis</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${slots.map(t=>`<button class="btn btn-ghost pb-slot" data-time="${t}" style="padding:8px 12px;font-size:12.5px;">${t}</button>`).join('') || '<div style="font-size:12.5px;color:var(--muted);">Sem horários livres neste dia.</div>'}
    </div>
  `;
  wrap.querySelectorAll('.pb-slot').forEach(b=>b.addEventListener('click', ()=>{
    pubBooking.time = b.dataset.time;
    wrap.querySelectorAll('.pb-slot').forEach(x=>x.classList.remove('btn-gold'));
    b.classList.add('btn-gold');
    const form = document.getElementById('pb-form');
    form.style.display = 'flex';
    form.scrollIntoView({behavior:'smooth', block:'nearest'});
  }));
}

  clientShell(`
    <div class="auth-eyebrow">Área do cliente</div>

      ${!obrigatorio?`<button class="btn btn-ghost auth-switch" id="cp-back">Voltar</button>`:''}
    </div>
  `);
  document.getElementById('cp-back')?.addEventListener('click', renderClientPortal);
  document.getElementById('cp-save').addEventListener('click', async ()=>{

    const n1 = document.getElementById('cp-new').value;

    const { data: res, error } = await supa.rpc('client_change_password', {
      p_account_id: clientSession.accountId, p_current: cur, p_new: n1

    if(error || res?.error){ renderClientChangePassword(slug, obrigatorio, res?.error || 'Não foi possível trocar a senha.'); return; }
    clientSession.mustChangePassword = false;
    showToast('Senha atualizada!');
    renderClientPortal();
  });
}

  const { error } = await supa.from('client_requests').insert({
    shop_id: s.shopId, account_id: s.accountId,
    client_name: s.name, client_phone: s.phone,

    current_plan: s.plan?.name || null,
    requested_plan_id: planId || null,
    requested_plan_name: planName || null,
  });
  if(error){ showToast('Não foi possível enviar o pedido. Tente de novo.'); return; }
  showToast(tipo==='renovacao'
    ? 'Pedido de renovação enviado! A barbearia vai te mandar o link de pagamento.'
    : 'Pedido enviado! A barbearia vai confirmar a troca com você.');
}
