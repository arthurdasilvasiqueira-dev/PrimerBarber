<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#161310;
    --panel:#211c16;
    --panel-2:#2a2319;
    --border:#3a3223;
    --gold:#c9a24b;
    --gold-bright:#e3c078;
    --ink:#f3eee4;
    --muted:#a79c89;
    --muted-2:#7d745f;
    --ok:#7fa87f;
    --ok-bg:#22281f;
    --bad:#c17b6a;
    --bad-bg:#2a201c;
    --warn:#d0a94f;
  }
  :root[data-theme="light"]{
    --bg:#f7f4ee;
    --panel:#ffffff;
    --panel-2:#f1ece0;
    --border:#e2d8c3;
    --gold:#a9793a;
    --gold-bright:#8a5f28;
    --ink:#221d15;
    --muted:#6b6252;
    --muted-2:#8f8571;
    --ok:#3d7a45;
    --ok-bg:#e6f0e3;
    --bad:#a8402d;
    --bad-bg:#f6e3de;
    --warn:#8a6210;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--gold);color:#1a1610;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  a,button{font-family:inherit;}
  button{cursor:pointer;}
  input,select,textarea{font-family:inherit;background:var(--panel-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);}
  input::placeholder{color:var(--muted-2);}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;letter-spacing:.02em;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  .btn{border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;border:1px solid transparent;transition:all .15s;display:inline-flex;align-items:center;gap:7px;}
  .btn-gold{background:var(--gold);color:#1a1610;}
  .btn-gold:hover{background:var(--gold-bright);}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn-danger{background:transparent;border-color:var(--bad);color:var(--bad);}
  .btn-danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .divider-blade{height:2px;border-radius:2px;background:linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold-bright) 50%, var(--gold) 85%, transparent);opacity:.55;}

  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid transparent;}
  .nav-item:hover{color:var(--ink);background:var(--panel-2);}
  .nav-item.active{color:var(--gold-bright);background:var(--panel-2);border-color:var(--border);}
  .nav-item svg{flex-shrink:0;}

  .pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.02em;}
  .pill-ok{background:var(--ok-bg);color:var(--ok);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);}
  .pill-warn{background:#2c2515;color:var(--warn);}
  .pill-muted{background:var(--panel-2);color:var(--muted);}

  .ticket{position:relative;background:var(--panel-2);border:1px solid var(--border);border-radius:10px 10px 0 0;padding:14px 16px 18px;}
  .ticket::after{
    content:'';display:block;position:absolute;left:0;right:0;bottom:-9px;height:10px;
    background-image:
      linear-gradient(135deg, var(--panel-2) 50%, transparent 50%),
      linear-gradient(-135deg, var(--panel-2) 50%, transparent 50%);
    background-size:14px 14px;background-position:left bottom;background-repeat:repeat-x;
  }
  .modal-overlay{position:fixed;inset:0;background:rgba(10,8,6,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);color:var(--ink);padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);}

  .tab-scroll{scrollbar-width:thin;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);font-weight:600;padding:0 12px 10px;}
  td{padding:12px;font-size:14px;border-top:1px solid var(--border);}
  tr:hover td{background:rgba(255,255,255,.015);}

  @media (max-width: 860px){
    .sidebar{display:none;}
    .mobile-nav{display:flex !important;}
  }
</style>
</head>

function weekDates(){
  const now = new Date();
  const day = (now.getDay()+6)%7; // 0 = segunda
  const monday = new Date(now); monday.setDate(now.getDate()-day);
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    return d.toISOString().slice(0,10);
  });
}

function currentPeriod(){ return todayISO().slice(0,7); }
function commissionOwed(profId){
  const prof = state.professionals.find(p=>p.id===profId);
  const period = currentPeriod();
  const paidService = state.commissionPayments.filter(c=>c.professionalId===profId && c.source==='servico').reduce((a,c)=>a+Number(c.amount),0);
  const paidPote = state.commissionPayments.filter(c=>c.professionalId===profId && c.source==='pote' && c.period===period).reduce((a,c)=>a+Number(c.amount),0);
  const paidSaque = state.commissionPayments.filter(c=>c.professionalId===profId && c.source==='saque').reduce((a,c)=>a+Number(c.amount),0);
  const concludedAppts = state.appointments.filter(a=>a.professionalId===profId && a.status==='concluido').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let serviceEarned = 0;
  concludedAppts.forEach(ap=>{
    const s = serviceById(ap.serviceId); if(!s) return;
    const pct = (prof.serviceOverrides && prof.serviceOverrides[ap.serviceId]!=null) ? prof.serviceOverrides[ap.serviceId] : prof.commission;
    serviceEarned += s.price * (pct/100);
  });
  const potEarned = potCommissionForProf(profId);
  const serviceOwed = Math.max(0, serviceEarned - paidService);
  const potOwed = Math.max(0, potEarned - paidPote);
  const totalEarned = serviceEarned + potEarned;
  const totalPaid = paidService + paidPote + paidSaque;
  return {
    earned: totalEarned, serviceEarned, potEarned,
    paid: totalPaid, paidService, paidPote, paidSaque,
    owed: Math.max(0, totalEarned - totalPaid), serviceOwed, potOwed,
  };
}
function monthlyEarnedForProf(profId){
  const prof = state.professionals.find(p=>p.id===profId);
  if(!prof) return 0;
  const period = currentPeriod();
  const concludedThisMonth = state.appointments.filter(a=>a.professionalId===profId && a.status==='concluido' && a.date.startsWith(period));
  let total = 0;
  concludedThisMonth.forEach(ap=>{
    const s = serviceById(ap.serviceId); if(!s) return;
    const pct = (prof.serviceOverrides && prof.serviceOverrides[ap.serviceId]!=null) ? prof.serviceOverrides[ap.serviceId] : prof.commission;
    total += s.price * (pct/100);
  });
  return total + potCommissionForProf(profId);
}
function effectiveCommissionPercent(prof, serviceId){
  return (prof.serviceOverrides && prof.serviceOverrides[serviceId]!=null) ? prof.serviceOverrides[serviceId] : prof.commission;
}

/* ============ #4 HORÁRIOS E FOLGAS POR PROFISSIONAL ============ */
function isProfessionalWorking(prof, dateStr){
  const weekday = new Date(dateStr+'T00:00').getDay();
  if(!prof.workDays.includes(weekday)) return false;
  if(prof.timeOff.includes(dateStr)) return false;
  return true;
}
function timesOverlap(startA,durA,startB,durB){
  const toMin = t=>{ const [hh,mm]=t.split(':').map(Number); return hh*60+mm; };
  const aStart=toMin(startA), aEnd=aStart+durA, bStart=toMin(startB), bEnd=bStart+durB;
  return aStart<bEnd && bStart<aEnd;
}
function generateSlotsForProfessional(prof, dateStr, durationMin){
  if(!isProfessionalWorking(prof, dateStr)) return [];
  const slots = [];
  let [h,m] = prof.workStart.split(':').map(Number);
  const [eh,em] = prof.workEnd.split(':').map(Number);
  const workEndMinutes = eh*60+em;
  while(h*60+m < workEndMinutes){
    const timeStr = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    if(h*60+m+durationMin <= workEndMinutes){
      const conflict = state.appointments.some(a=>a.professionalId===prof.id && a.date===dateStr && a.status!=='cancelado' && a.status!=='faltou' &&
        timesOverlap(a.time, serviceById(a.serviceId)?.duration||30, timeStr, durationMin));
      if(!conflict) slots.push(timeStr);
    }
    m+=15; if(m>=60){ m-=60; h+=1; }
  }
  return slots;
}

  const rate = relevant.length ? (noShows.length/relevant.length*100) : 0;
  const byProf = state.professionals.map(p=>{
    const total = relevant.filter(a=>a.professionalId===p.id).length;
    const faltas = relevant.filter(a=>a.professionalId===p.id && a.status==='faltou').length;
    return {prof:p, total, faltas, rate: total ? (faltas/total*100) : 0};
  });
  return {rate, total:noShows.length, byProf};
}

/* ============ #7 AVALIAÇÕES ============ */
function ratingStats(profId){
  const rated = state.appointments.filter(a=>a.professionalId===profId && a.rating);
  if(rated.length===0) return {avg:0, count:0};
  const avg = rated.reduce((a,r)=>a+r.rating.stars,0)/rated.length;
  return {avg, count:rated.length};
}

/* ============ #8 PROGRAMA DE INDICAÇÃO ============ */
function maybeAwardReferral(client){
  if(!client.referredBy || client.referralBonusGiven) return;
  const referrer = state.clients.find(c=>c.name.trim().toLowerCase()===client.referredBy.trim().toLowerCase());
  if(!referrer) return;
  referrer.points = (referrer.points||0) + (state.loyalty.referralBonusPoints||0);
  client.referralBonusGiven = true;
}

/* ============ SISTEMA DE POTE (clube de assinatura) — por fichas ============ */
// Todo mês, a soma de todos os assinantes pagos forma UM pote geral.
// Desse pote, uma % fica pra barbearia e o restante ("bolo dos profissionais")
// é dividido proporcionalmente pela quantidade de fichas que cada profissional
// acumulou no mês. Cada serviço tem um valor de fichas configurável — quando
// um profissional atende um cliente assinante pago, ganha as fichas daquele serviço.
function clubMonthlyPot(){
  return state.subscriptionMembers.filter(m=>m.status==='pago').reduce((total,m)=>{
    const plan = state.subscriptionPlans.find(p=>p.id===m.planId);
    return total + (plan ? plan.price : 0);
  }, 0);
}
function clubFichaEntries(){
  const monthPrefix = todayISO().slice(0,7);
  const payingNames = new Set(state.subscriptionMembers.filter(m=>m.status==='pago').map(m=>m.name.trim().toLowerCase()));
  return state.appointments
    .filter(a=>a.status==='concluido' && a.date.startsWith(monthPrefix) && payingNames.has(a.client.trim().toLowerCase()))
    .map(a=>{
      const service = serviceById(a.serviceId);
      return {appt:a, service, fichas: service?.clubFichas||0};
    })
    .filter(e=>e.fichas>0);
}
function clubFichasBreakdown(){
  const entries = clubFichaEntries();
  const totalFichas = entries.reduce((a,e)=>a+e.fichas,0);
  const potTotal = clubMonthlyPot();
  const staffPercent = state.commissionSettings.clubStaffPercent ?? 60;
  const potStaff = potTotal * (staffPercent/100);
  const potBarbearia = potTotal - potStaff;
  const byProf = {};
  entries.forEach(e=>{ byProf[e.appt.professionalId] = (byProf[e.appt.professionalId]||0) + e.fichas; });
  const rows = state.professionals.map(p=>{
    const fichas = byProf[p.id] || 0;
    const value = totalFichas>0 ? potStaff*(fichas/totalFichas) : 0;
    return {prof:p, fichas, value};
  }).filter(r=>r.fichas>0);
  return {potTotal, potStaff, potBarbearia, staffPercent, totalFichas, entries, rows};
}
function potCommissionForProf(profId){
  const row = clubFichasBreakdown().rows.find(r=>r.prof.id===profId);
  return row ? row.value : 0;
}
function asaasSummary(){
  const inMonth = state.subscriptionMembers.filter(m=>m.paymentMethod==='asaas');
  const cash = state.subscriptionMembers.filter(m=>m.paymentMethod==='dinheiro');
  const planPrice = m => state.subscriptionPlans.find(p=>p.id===m.planId)?.price || 0;
  return {
    asaasPago: inMonth.filter(m=>m.status==='pago'),
    asaasPendente: inMonth.filter(m=>m.status==='pendente'),
    asaasAtrasado: inMonth.filter(m=>m.status==='atrasado'),
    cashPago: cash.filter(m=>m.status==='pago'),
    cashPendente: cash.filter(m=>m.status!=='pago' && m.status!=='cancelado'),
    // soma apenas o valor que de fato entrou (cobranças pagas), não saldo de conta
    totalRecebidoAsaas: inMonth.filter(m=>m.status==='pago').reduce((a,m)=>a+planPrice(m),0),
    totalRecebidoDinheiro: cash.filter(m=>m.status==='pago').reduce((a,m)=>a+planPrice(m),0),
  };
}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <div class="font-display" style="font-size:16px;font-weight:600;">Clientes por profissional na semana</div>
        <div style="font-size:12px;color:var(--muted-2);">${new Date(days[0]+'T00:00').toLocaleDateString('pt-BR')} – ${new Date(days[6]+'T00:00').toLocaleDateString('pt-BR')}</div>
      </div>
      <table style="min-width:620px;">
        <thead>
          <tr>
            <th style="min-width:150px;">Profissional</th>
            ${days.map((d,i)=>`<th style="text-align:center;${d===todayStr?'color:var(--gold-bright);':''}">${dayLabels[i]}<div style="font-weight:400;font-size:10.5px;color:var(--muted-2);">${new Date(d+'T00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div></th>`).join('')}
            <th style="text-align:center;">Total</th>
          </tr>
        </thead>
        <tbody>
          ${state.professionals.length===0 ? `<tr><td colspan="${days.length+2}" style="text-align:center;color:var(--muted);padding:20px;">Nenhum profissional cadastrado.</td></tr>` :
          state.professionals.map(p=>{
            const counts = days.map(d=>clientsPerProfPerDay(p.id, d));
            const total = counts.reduce((a,c)=>a+c,0);
            return `<tr>
              <td style="font-weight:500;">${p.name}</td>
              ${counts.map((c,i)=>`<td style="text-align:center;${days[i]===todayStr?'background:rgba(201,162,75,.08);':''}">
                ${c>0?`<span class="pill pill-warn font-mono">${c}</span>`:`<span style="color:var(--muted-2);">–</span>`}
              </td>`).join('')}
              <td style="text-align:center;font-weight:600;" class="font-mono">${total}</td>
            </tr>`;
          }).join('')}
        </tbody>
        ${state.professionals.length>0?`<tfoot><tr>
          <td style="font-weight:600;color:var(--muted);">Total do dia</td>
          ${days.map(d=>{
            const t = state.professionals.reduce((a,p)=>a+clientsPerProfPerDay(p.id,d),0);
            return `<td style="text-align:center;font-weight:600;${d===todayStr?'color:var(--gold-bright);':'color:var(--muted);'}" class="font-mono">${t}</td>`;
          }).join('')}
          <td style="text-align:center;font-weight:700;" class="font-mono">${state.professionals.reduce((a,p)=>a+days.reduce((b,d)=>b+clientsPerProfPerDay(p.id,d),0),0)}</td>
        </tr></tfoot>`:''}
      </table>
    </div>
  `;
}

    update(s=>{ s.appointments = s.appointments.filter(a=>a.id!==b.dataset.delAppt); });

  view.querySelectorAll('[data-request-review]').forEach(b=>b.addEventListener('click', ()=>requestReviewModal(b.dataset.requestReview)));

function autoExpireUnpaidDeposits(){
  const expired = expiredDepositAppointments();
  if(expired.length===0) return;
  update(s=>{
    expired.forEach(a=>{
      const appt = s.appointments.find(x=>x.id===a.id);
      if(appt){ appt.status='cancelado'; appt.depositStatus='pendente'; }
    });
  });
}
function cancelAppointment(id, newStatus){
  let freed = null;
  update(s=>{
    const appt = s.appointments.find(a=>a.id===id);
    appt.status = newStatus;
    freed = {date:appt.date, time:appt.time, professionalId:appt.professionalId};
  });
  const match = tryFillFromWaitlist(freed.date, freed.time, freed.professionalId);
  if(match){
    showToast(`${newStatus==='faltou'?'Falta registrada':'Cancelado'}. ${match.clientName} está na lista de espera para esse horário — avise-o em Lista de Espera.`);
  }else{
    showToast(newStatus==='faltou' ? 'Falta registrada.' : 'Agendamento cancelado.');
  }
}

  const appt = state.appointments.find(a=>a.id===apptId);

  openModal(`

        ${phone ? `<a class="btn btn-ghost" href="${waLink(phone, text)}" target="_blank" rel="noopener">${ICON.send} Pedir por WhatsApp</a>` : ''}

    root.querySelector('#f-submit-rating').addEventListener('click', ()=>{
      if(stars===0){ showToast('Selecione uma nota.'); return; }

function concludeAppt(id){
  const session = openSession();
  if(!session){ showToast('Abra o caixa antes de concluir atendimentos.'); route='caixa'; render(); return; }
  update(s=>{
    const appt = s.appointments.find(a=>a.id===id);
    appt.status='concluido';
    const service = serviceById(appt.serviceId);
    const sess = s.cashSessions.find(c=>c.status==='aberto');
    const netAmount = appt.depositStatus==='pago' ? Math.max(0, service.price - appt.depositAmount) : service.price;
    sess.entries.push({id:uid(), type:'entrada', desc:`${service.name} — ${appt.client}${appt.depositStatus==='pago'?' (saldo, sinal já recebido)':''}`, amount:netAmount, time:new Date().toTimeString().slice(0,5), auto:true});
    const client = s.clients.find(c=>c.name.trim().toLowerCase()===appt.client.trim().toLowerCase());
    if(client) maybeAwardReferral(client);
  });
  showToast('Atendimento concluído e lançado no caixa.');
}

/* ============ COMISSÕES ============ */
function periodLabel(period){
  const [y,m] = period.split('-');
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return `${meses[parseInt(m)-1]}/${y}`;
}
function monthAlreadyClosed(period){
  return state.commissionPayments.some(c=>c.source==='pote' && c.period===period);
}

function withdrawalRequestModal(prof){
  const owed = commissionOwed(prof.id).owed;
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">Solicitar saque</div>
        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Você tem ${BRL(owed)} disponível a receber. O dono vai revisar e marcar como pago.</div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div><label>Valor do saque (R$)</label><input id="f-amount" type="number" step="0.01" min="0" max="${owed}" value="${owed>0?owed.toFixed(2):''}" style="width:100%;"></div>
        <div><label>Observação (opcional)</label><input id="f-note" placeholder="Ex: preciso até sexta" style="width:100%;"></div>
        <button class="btn btn-gold" id="f-submit" style="justify-content:center;margin-top:4px;">Enviar solicitação</button>
      </div>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#f-submit').addEventListener('click', ()=>{
      const amount = parseFloat(root.querySelector('#f-amount').value);
      const note = root.querySelector('#f-note').value.trim();
      if(isNaN(amount) || amount<=0){ showToast('Informe um valor válido.'); return; }
      if(amount > owed){ showToast('O valor não pode passar do que você tem a receber.'); return; }
      update(s=>{
        s.withdrawalRequests.push({id:uid(), professionalId:prof.id, amount, note, status:'pendente', createdAt:new Date().toISOString()});
      });
      showToast('Solicitação de saque enviada.');
      closeModal();
      render();
    });
  });
}

function closeClubMonthModal(){
  const period = currentPeriod();
  if(monthAlreadyClosed(period)){ showToast('O pote deste mês já foi fechado.'); return; }
  const rows = state.professionals.map(p=>({prof:p, owed: commissionOwed(p.id).potOwed})).filter(r=>r.owed>0);
  if(rows.length===0){ showToast('Não há pote a fechar neste mês.'); return; }
  const total = rows.reduce((a,r)=>a+r.owed,0);
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">Fechar pote de ${periodLabel(period)}</div>
        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px;">Confirmar paga a comissão do pote do clube a todos os profissionais abaixo, de uma vez.</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;">
        ${rows.map(r=>`<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:8px 12px;background:var(--panel-2);border-radius:8px;">
          <span>${r.prof.name}</span><span class="font-mono" style="color:var(--gold-bright);">${BRL(r.owed)}</span>
        </div>`).join('')}
        <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding:8px 12px;">
          <span>Total do fechamento</span><span class="font-mono">${BRL(total)}</span>
        </div>
      </div>
      <button class="btn btn-gold" id="f-submit" style="width:100%;justify-content:center;">Confirmar fechamento e pagar</button>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#f-submit').addEventListener('click', ()=>{
      update(s=>{
        rows.forEach(r=>{
          s.commissionPayments.push({id:uid(), professionalId:r.prof.id, amount:r.owed, date:new Date().toISOString(), source:'pote', period});
        });
      });
      closeModal();
      showToast(`Fechamento de ${periodLabel(period)} concluído.`);
    });
  });
}

/* ============ PROFISSIONAIS ============ */
const WEEKDAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function renderProfissionais(view){
  const limits = planLimits(currentShop);
  const atLimit = state.professionals.length >= limits.maxProfessionals;
  view.innerHTML = `
    ${pageHeader('Profissionais', state.professionals.length+' cadastrado(s)'+(limits.maxProfessionals!==Infinity?` de ${limits.maxProfessionals} (plano ${limits.label})`:''), `<button class="btn btn-gold" id="btn-new-prof" ${atLimit?'disabled title="Limite do plano Basic atingido"':''}>${ICON.plus} Novo profissional</button>`)}
    ${atLimit ? `<div class="pill pill-warn" style="display:block;margin-bottom:14px;padding:10px 14px;">Você atingiu o limite de ${limits.maxProfessionals} profissionais do plano Basic. <a href="#" id="lnk-upgrade-prof" style="color:var(--gold-bright);text-decoration:underline;">Assine o plano Pro</a> para cadastrar profissionais ilimitados.</div>` : ''}
    ${state.professionals.length===0 ? emptyState('Nenhum profissional cadastrado.') : `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;">
        ${state.professionals.map(p=>{
          const rt = ratingStats(p.id);
          return `<div class="card" style="padding:16px 18px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div style="font-weight:600;font-size:15px;">${p.name}</div>
                <div style="font-size:12.5px;color:var(--muted);margin-top:3px;">${p.phone||'Sem telefone'}</div>
                <span class="pill pill-muted" style="margin-top:6px;display:inline-block;">${roleLabel(p.accessRole)}</span>
              </div>
              <span class="pill pill-warn font-mono">${p.commission}%</span>
            </div>
            <div style="font-size:11.5px;color:var(--muted-2);margin-top:10px;">${p.workDays.map(d=>WEEKDAY_LABELS[d]).join(' ')} · ${p.workStart}–${p.workEnd}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
              <div style="font-size:11.5px;color:var(--muted-2);">${ICON.shield} PIN ${p.pin}</div>
              ${rt.count>0 ? `<div style="font-size:12px;color:var(--gold-bright);display:flex;align-items:center;gap:3px;">${ICON.star} ${rt.avg.toFixed(1)} (${rt.count})</div>` : ''}
            </div>
            <div style="display:flex;gap:6px;margin-top:14px;">
              <button class="btn btn-ghost" style="flex:1;justify-content:center;padding:7px;" data-edit-prof="${p.id}">${ICON.edit} Editar</button>
              <button class="btn btn-ghost" style="padding:7px 9px;color:var(--bad);border-color:var(--bad);" data-del-prof="${p.id}">${ICON.trash}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    `}
  `;
  view.querySelector('#btn-new-prof').addEventListener('click', ()=>{
    if(state.professionals.length >= planLimits(currentShop).maxProfessionals){ renderPaywallUpgrade('profissionais'); return; }
    profModal();
  });
  view.querySelector('#lnk-upgrade-prof')?.addEventListener('click', (e)=>{ e.preventDefault(); renderPaywallUpgrade('profissionais'); });
  view.querySelectorAll('[data-edit-prof]').forEach(b=>b.addEventListener('click', ()=>profModal(state.professionals.find(p=>p.id===b.dataset.editProf))));
  view.querySelectorAll('[data-del-prof]').forEach(b=>b.addEventListener('click', ()=>{
    update(s=>{ s.professionals = s.professionals.filter(p=>p.id!==b.dataset.delProf); });
  }));
}
function profModal(existing){
  const isEdit = !!existing;
  const workDays = existing?.workDays || [1,2,3,4,5,6];
  const timeOff = existing?.timeOff || [];
  const overrides = existing?.serviceOverrides || {};
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">${isEdit?'Editar':'Novo'} profissional</div>
        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div><label>Nome</label><input id="f-name" value="${existing?.name||''}" placeholder="Nome completo" style="width:100%;"></div>
        <div><label>Telefone</label><input id="f-phone" value="${existing?.phone||''}" placeholder="(00) 00000-0000" style="width:100%;"></div>
        <div>
          <label>Nível de acesso ao sistema</label>
          <select id="f-access-role" style="width:100%;">
            <option value="profissional" ${(!existing||existing.accessRole==='profissional'||!existing.accessRole)?'selected':''}>Profissional — vê a própria agenda, comissões e pode solicitar saques</option>
            <option value="recepcionista" ${existing?.accessRole==='recepcionista'?'selected':''}>Recepcionista — agenda, clientes, caixa, estoque e mensagens</option>
            <option value="admin" ${existing?.accessRole==='admin'?'selected':''}>Dono / Admin — acesso completo ao sistema</option>
          </select>
        </div>
        <div style="display:flex;gap:10px;">
          <div style="flex:1;"><label>Comissão base (%)</label><input id="f-comm" type="number" min="0" max="100" value="${existing?.commission ?? 40}" style="width:100%;"></div>
          <div style="flex:1;"><label>PIN de login (4 dígitos)</label><input id="f-pin" maxlength="4" value="${existing?.pin || String(1000+Math.floor(Math.random()*9000))}" style="width:100%;"></div>
        </div>

        <label>Dias de trabalho</label>
        <div style="display:flex;gap:5px;flex-wrap:wrap;">
          ${WEEKDAY_LABELS.map((lbl,idx)=>`<label style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;">
            <input type="checkbox" data-workday="${idx}" ${workDays.includes(idx)?'checked':''} style="width:auto;">${lbl}
          </label>`).join('')}
        </div>
        <div style="display:flex;gap:10px;">
          <div style="flex:1;"><label>Início do expediente</label><input id="f-start" type="time" value="${existing?.workStart||'09:00'}" style="width:100%;"></div>
          <div style="flex:1;"><label>Fim do expediente</label><input id="f-end" type="time" value="${existing?.workEnd||'19:00'}" style="width:100%;"></div>
        </div>

        <label>Folgas / bloqueios de data</label>
        <div style="display:flex;gap:8px;">
          <input id="f-timeoff-date" type="date" style="flex:1;">
          <button class="btn btn-ghost" id="btn-add-timeoff" style="padding:8px 12px;">${ICON.plus}</button>
        </div>
        <div id="timeoff-list" style="display:flex;flex-wrap:wrap;gap:6px;">
          ${timeOff.map(d=>`<span class="pill pill-muted" data-timeoff-chip="${d}">${new Date(d+'T00:00').toLocaleDateString('pt-BR')} ${ICON.x}</span>`).join('')}
        </div>

        ${state.services.length>0 ? `
        <label>Comissão por serviço (opcional — sobrescreve a base)</label>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${state.services.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span style="font-size:13px;flex:1;">${s.name}</span>
            <input type="number" min="0" max="100" placeholder="${existing?.commission ?? 40}" data-override="${s.id}" value="${overrides[s.id]??''}" style="width:80px;">
          </div>`).join('')}
        </div>` : ''}

        <button class="btn btn-gold" id="f-submit" style="justify-content:center;margin-top:4px;">${isEdit?'Salvar':'Cadastrar'}</button>
      </div>
    </div>
  `, root=>{
    let currentTimeOff = [...timeOff];
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#btn-add-timeoff').addEventListener('click', ()=>{
      const d = root.querySelector('#f-timeoff-date').value;
      if(!d || currentTimeOff.includes(d)) return;
      currentTimeOff.push(d);
      const chip = document.createElement('span');
      chip.className='pill pill-muted'; chip.dataset.timeoffChip=d;
      chip.innerHTML = `${new Date(d+'T00:00').toLocaleDateString('pt-BR')} ${ICON.x}`;
      chip.style.cursor='pointer';
      chip.addEventListener('click', ()=>{ currentTimeOff = currentTimeOff.filter(x=>x!==d); chip.remove(); });
      root.querySelector('#timeoff-list').appendChild(chip);
    });
    root.querySelectorAll('[data-timeoff-chip]').forEach(chip=>{
      chip.style.cursor='pointer';
      chip.addEventListener('click', ()=>{ currentTimeOff = currentTimeOff.filter(x=>x!==chip.dataset.timeoffChip); chip.remove(); });
    });
    root.querySelector('#f-submit').addEventListener('click', ()=>{
      const name = root.querySelector('#f-name').value.trim();
      const phone = root.querySelector('#f-phone').value.trim();
      const accessRole = root.querySelector('#f-access-role').value;
      const commission = parseFloat(root.querySelector('#f-comm').value)||0;
      const pin = root.querySelector('#f-pin').value.trim() || '0000';
      const selectedDays = [...root.querySelectorAll('[data-workday]:checked')].map(el=>parseInt(el.dataset.workday));
      const workStart = root.querySelector('#f-start').value;
      const workEnd = root.querySelector('#f-end').value;
      const serviceOverrides = {};
      root.querySelectorAll('[data-override]').forEach(inp=>{
        if(inp.value!=='') serviceOverrides[inp.dataset.override] = parseFloat(inp.value);
      });
      if(!name){ showToast('Informe o nome.'); return; }
      const data = {name, phone, accessRole, commission, pin, workDays:selectedDays, workStart, workEnd, timeOff:currentTimeOff, serviceOverrides};
      update(s=>{
        if(isEdit){ Object.assign(existing, data); }
        else{ s.professionals.push({id:uid(), ...data}); }
      });
      closeModal();
    });
  });
}

/* ============ SERVIÇOS ============ */
function renderServicos(view){
  view.innerHTML = `
    ${pageHeader('Serviços', state.services.length+' cadastrado(s)', `<button class="btn btn-gold" id="btn-new-svc">${ICON.plus} Novo serviço</button>`)}
    ${state.services.length===0 ? emptyState('Nenhum serviço cadastrado.') : `
      <table>
        <thead><tr><th>Serviço</th><th>Valor</th><th>Duração</th><th>Sinal</th><th>Fichas</th><th></th></tr></thead>
        <tbody>
        ${state.services.map(s=>`<tr>
          <td style="font-weight:500;">${s.name}</td>
          <td class="font-mono">${BRL(s.price)}</td>
          <td class="font-mono" style="color:var(--muted);">${s.duration} min</td>
          <td>${s.requireDeposit ? `<span class="pill pill-warn font-mono">${ICON.timer} ${BRL(depositAmountFor(s))}</span>` : '<span class="pill pill-muted">Não exige</span>'}</td>
          <td class="font-mono" style="color:${s.clubFichas>0?'var(--gold-bright)':'var(--muted-2)'};">${s.clubFichas||0}</td>
          <td style="text-align:right;">
            <button class="btn btn-ghost" style="padding:6px 8px;" data-edit-svc="${s.id}">${ICON.edit}</button>
            <button class="btn btn-ghost" style="padding:6px 8px;color:var(--bad);border-color:var(--bad);" data-del-svc="${s.id}">${ICON.trash}</button>
          </td>
        </tr>`).join('')}
        </tbody>
      </table>
    `}
  `;
  view.querySelector('#btn-new-svc').addEventListener('click', ()=>svcModal());
  view.querySelectorAll('[data-edit-svc]').forEach(b=>b.addEventListener('click', ()=>svcModal(state.services.find(s=>s.id===b.dataset.editSvc))));
  view.querySelectorAll('[data-del-svc]').forEach(b=>b.addEventListener('click', ()=>{
    update(s=>{ s.services = s.services.filter(sv=>sv.id!==b.dataset.delSvc); });
  }));
}
function svcModal(existing){
  const isEdit = !!existing;
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">${isEdit?'Editar':'Novo'} serviço</div>
        <button class="btn btn-ghost" style="padding:6px;" id="m-close">${ICON.x}</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div><label>Nome do serviço</label><input id="f-name" value="${existing?.name||''}" placeholder="Ex: Corte Masculino" style="width:100%;"></div>
        <div style="display:flex;gap:10px;">
          <div style="flex:1;"><label>Valor (R$)</label><input id="f-price" type="number" step="0.01" min="0" value="${existing?.price??''}" style="width:100%;"></div>
          <div style="flex:1;"><label>Duração (min)</label><input id="f-dur" type="number" min="1" value="${existing?.duration??''}" style="width:100%;"></div>
        </div>
        <label style="display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);cursor:pointer;"><input type="checkbox" id="f-req-deposit" ${existing?.requireDeposit?'checked':''} style="width:auto;padding:0;"> Exigir sinal antecipado neste serviço</label>
        <div id="deposit-fields" style="display:${existing?.requireDeposit?'flex':'none'};gap:10px;">
          <div style="flex:1;"><label>Tipo</label><select id="f-dep-type" style="width:100%;">
            <option value="percentual" ${existing?.depositType==='percentual'?'selected':''}>% do valor</option>
            <option value="fixo" ${existing?.depositType==='fixo'?'selected':''}>Valor fixo (R$)</option>
          </select></div>
          <div style="flex:1;"><label>Valor</label><input id="f-dep-value" type="number" min="0" step="0.01" value="${existing?.depositValue??30}" style="width:100%;"></div>
        </div>
        <div><label>Fichas no Clube de Assinatura</label><input id="f-fichas" type="number" min="0" step="1" value="${existing?.clubFichas??0}" style="width:100%;">
          <div style="font-size:11px;color:var(--muted-2);margin-top:4px;">Quantas fichas o profissional ganha ao fazer este serviço em um cliente assinante do clube — usado para dividir o pote no fechamento do mês.</div>
        </div>
        <button class="btn btn-gold" id="f-submit" style="justify-content:center;margin-top:4px;">${isEdit?'Salvar':'Cadastrar'}</button>
      </div>
    </div>
  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#f-req-deposit').addEventListener('change', e=>{
      root.querySelector('#deposit-fields').style.display = e.target.checked ? 'flex' : 'none';
    });
    root.querySelector('#f-submit').addEventListener('click', ()=>{
      const name = root.querySelector('#f-name').value.trim();
      const price = parseFloat(root.querySelector('#f-price').value);
      const duration = parseInt(root.querySelector('#f-dur').value);
      if(!name || isNaN(price) || isNaN(duration)){ showToast('Preencha todos os campos.'); return; }
      const requireDeposit = root.querySelector('#f-req-deposit').checked;
      const depositType = root.querySelector('#f-dep-type').value;
      const depositValue = parseFloat(root.querySelector('#f-dep-value').value)||0;
      const clubFichas = parseInt(root.querySelector('#f-fichas').value)||0;
      update(s=>{
        if(isEdit){ Object.assign(existing, {name, price, duration, requireDeposit, depositType, depositValue, clubFichas}); }
        else{ s.services.push({id:uid(), name, price, duration, requireDeposit, depositType, depositValue, clubFichas}); }
      });
      closeModal();
    });
  });
}

/* ============ CLUBE DE ASSINATURA ============ */
function statusPillMember(status){
  if(status==='pago') return '<span class="pill pill-ok">Pago</span>';
  if(status==='pendente') return '<span class="pill pill-warn">Pendente</span>';
  if(status==='atrasado') return '<span class="pill pill-bad">Atrasado</span>';
  return '<span class="pill pill-muted">Cancelado</span>';
}
function methodLabel(m){
  if(m.paymentMethod==='dinheiro') return '<span class="pill pill-muted">Dinheiro</span>';
  return '<span class="pill pill-muted">'+ICON.link+' Pix/Cartão (Asaas)</span>';
}
function renderClube(view){
  if(!planLimits(currentShop).club){
    view.innerHTML = `
      ${pageHeader('Clube de Assinatura', 'Recurso exclusivo do plano Pro')}
      <div class="card" style="padding:32px;text-align:center;">
        <div style="width:48px;height:48px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#1a1610;margin:0 auto 16px;">${ICON.lock}</div>
        <div class="font-display" style="font-size:17px;font-weight:600;margin-bottom:8px;">Disponível no plano Pro</div>
        <div style="font-size:13.5px;color:var(--muted);max-width:420px;margin:0 auto 20px;line-height:1.6;">
          O Clube de Assinatura (pote mensal, cobrança recorrente de clientes) faz parte do plano Pro.
          Faça upgrade para ativar este recurso.
        </div>
        <button class="btn btn-gold" id="btn-upgrade-clube" style="margin:0 auto;">Fazer upgrade para o Pro</button>
      </div>
    `;
    view.querySelector('#btn-upgrade-clube').addEventListener('click', ()=>renderPaywallUpgrade('clube'));
    return;
  }
  const mrr = state.subscriptionMembers.filter(m=>m.status!=='cancelado').reduce((a,m)=>{
    const plan = state.subscriptionPlans.find(p=>p.id===m.planId); return a+(plan?plan.price:0);
  },0);
  const sum = asaasSummary();
  const recebidoMes = sum.totalRecebidoAsaas + sum.totalRecebidoDinheiro;

  view.innerHTML = `
    ${pageHeader('Clube de Assinatura', 'Planos recorrentes e membros', `<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-ghost" id="btn-new-plan">${ICON.plus} Plano</button><button class="btn btn-gold" id="btn-new-member">${ICON.plus} Membro</button></div>`)}

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px;">
      ${statCard('Receita recorrente (MRR)', BRL(mrr), 'somando assinaturas não canceladas', 'ok')}
      ${statCard('Recebido este mês', BRL(recebidoMes), 'valor que efetivamente entrou (Asaas + dinheiro)', 'ok')}
      ${statCard('Planos disponíveis', state.subscriptionPlans.length, 'configurados', 'ok')}
    </div>

    <div class="card" style="padding:18px 20px;margin-bottom:26px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <div class="font-display" style="font-size:16px;font-weight:600;">Recebimento via Asaas (Pix/Cartão)</div>
        <button class="btn btn-ghost" id="btn-sync-asaas">${ICON.link} Sincronizar com Asaas</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;">
        ${statCard('Pagos', sum.asaasPago.length, BRL(sum.totalRecebidoAsaas)+' recebidos', 'ok')}
        ${statCard('Pendentes', sum.asaasPendente.length, 'aguardando cobrança', sum.asaasPendente.length>0?'warn':'ok')}
        ${statCard('Em atraso', sum.asaasAtrasado.length, 'cobrança vencida', sum.asaasAtrasado.length>0?'bad':'ok')}
      </div>
      <div style="font-size:11.5px;color:var(--muted-2);margin-top:12px;">Considera apenas o valor das cobranças de assinatura pagas no Asaas — não o saldo disponível na conta.</div>
    </div>

    <div class="card" style="padding:18px 20px;margin-bottom:26px;">
      <div class="font-display" style="font-size:16px;font-weight:600;margin-bottom:14px;">Recebimento em dinheiro</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;">
        ${statCard('Pagos em dinheiro', sum.cashPago.length, BRL(sum.totalRecebidoDinheiro)+' recebidos', 'ok')}
        ${statCard('Aguardando pagamento', sum.cashPendente.length, 'marcar manualmente ao receber', sum.cashPendente.length>0?'warn':'ok')}
      </div>
    </div>

    <div class="font-display" style="font-size:16px;font-weight:600;margin-bottom:10px;">Planos</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:26px;">
      ${state.subscriptionPlans.map(p=>`
        <div class="card" style="padding:16px 18px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="font-weight:600;font-size:15px;">${p.name}</div>
            ${p.category ? `<span class="pill" style="flex-shrink:0;">${p.category}</span>` : ''}
          </div>
          <div class="font-mono" style="font-size:19px;color:var(--gold-bright);margin:6px 0;">${BRL(p.price)}<span style="font-size:12px;color:var(--muted-2);">/mês</span></div>
          ${p.includedServiceIds && p.includedServiceIds.length ? `<div style="font-size:11.5px;color:var(--muted);margin-bottom:4px;">Inclui: ${p.includedServiceIds.map(id=>serviceById(id)?.name).filter(Boolean).join(', ')}</div>` : ''}
          ${p.discountPercent>0 ? `<div style="font-size:11.5px;color:var(--muted);margin-bottom:4px;">${p.discountPercent}% de desconto em serviços extras</div>` : ''}
          ${p.benefits ? `<div style="font-size:12.5px;color:var(--muted);">${p.benefits}</div>` : ''}
          <div style="display:flex;gap:6px;margin-top:12px;">
            <button class="btn btn-ghost" style="flex:1;justify-content:center;padding:6px;" data-edit-plan="${p.id}">${ICON.edit}</button>
            <button class="btn btn-ghost" style="padding:6px 9px;color:var(--bad);border-color:var(--bad);" data-del-plan="${p.id}">${ICON.trash}</button>
          </div>
        </div>
      `).join('')}
      ${state.subscriptionPlans.length===0?emptyState('Nenhum plano criado ainda.'):''}
    </div>

    <div class="font-display" style="font-size:16px;font-weight:600;margin-bottom:10px;">Membros</div>
    ${state.subscriptionMembers.length===0 ? emptyState('Nenhum membro cadastrado ainda.') : `
      <table>
        <thead><tr><th>Membro</th><th>Plano</th><th>Método</th><th>Vencimento</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${state.subscriptionMembers.map(m=>{
          const plan = state.subscriptionPlans.find(p=>p.id===m.planId);
          return `<tr>
            <td style="font-weight:500;">${m.name}<div style="font-size:11.5px;color:var(--muted-2);font-weight:400;">${m.phone||''}</div></td>
            <td>${plan?plan.name:'—'}</td>
            <td>${methodLabel(m)}</td>
            <td class="font-mono">${m.dueDate?new Date(m.dueDate+'T00:00').toLocaleDateString('pt-BR'):'—'}</td>
            <td>${statusPillMember(m.status)}</td>
            <td style="text-align:right;white-space:nowrap;">
              ${m.invoiceUrl ? `<a href="${m.invoiceUrl}" target="_blank" class="btn btn-ghost" style="padding:6px 10px;text-decoration:none;">${ICON.link} Ver cobrança</a>` : ''}
              ${m.paymentMethod==='dinheiro' && m.status!=='pago' && m.status!=='cancelado' ? `<button class="btn btn-ghost" style="padding:6px 10px;color:var(--ok);border-color:var(--ok);" data-mark-cash="${m.id}">Marcar pago (dinheiro)</button>` : ''}
              <button class="btn btn-ghost" style="padding:6px 8px;" data-edit-member="${m.id}">${ICON.edit}</button>

            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    `}
    <div style="margin-top:14px;font-size:12px;color:var(--muted-2);display:flex;align-items:center;gap:6px;">${ICON.link} Assinantes com pagamento via Pix/Cartão são sincronizados com o Asaas em <span data-goto="config" style="color:var(--gold-bright);cursor:pointer;text-decoration:underline;">Integração Asaas</span>. Pagamentos em dinheiro são marcados manualmente aqui.</div>
  `;
  view.querySelector('#btn-new-plan').addEventListener('click', ()=>planModal());
  view.querySelector('#btn-new-member').addEventListener('click', ()=>memberModal());
  view.querySelector('#btn-sync-asaas').addEventListener('click', syncAsaas);
  view.querySelectorAll('[data-edit-plan]').forEach(b=>b.addEventListener('click', ()=>planModal(state.subscriptionPlans.find(p=>p.id===b.dataset.editPlan))));
  view.querySelectorAll('[data-del-plan]').forEach(b=>b.addEventListener('click', ()=>update(s=>{ s.subscriptionPlans = s.subscriptionPlans.filter(p=>p.id!==b.dataset.delPlan); })));
  view.querySelectorAll('[data-edit-member]').forEach(b=>b.addEventListener('click', ()=>memberModal(state.subscriptionMembers.find(m=>m.id===b.dataset.editMember))));
  view.querySelectorAll('[data-del-member]').forEach(b=>b.addEventListener('click', ()=>update(s=>{ s.subscriptionMembers = s.subscriptionMembers.filter(m=>m.id!==b.dataset.delMember); })));
  view.querySelectorAll('[data-mark-cash]').forEach(b=>b.addEventListener('click', ()=>{
    update(s=>{
      const m = s.subscriptionMembers.find(mm=>mm.id===b.dataset.markCash);
      const plan = s.subscriptionPlans.find(p=>p.id===m.planId);
      m.status = 'pago'; m.lastPaymentDate = todayISO(); m.lastPaymentAmount = plan?plan.price:0;
    });
    showToast('Pagamento em dinheiro registrado.');
  }));
  view.querySelector('[data-goto="config"]')?.addEventListener('click', ()=>{ route='config'; render(); });
}
async function syncAsaas(){
  if(!state.asaas.apiKey){
    showToast('Configure sua API Key do Asaas em Integração Asaas antes de sincronizar.');
    return;
  }
  showToast('Sincronizando com o Asaas...');
  const { data: result, error } = await supa.functions.invoke('asaas-sync', { body: { action:'sync_status' } });
  if(error || result?.error){ showToast(result?.error || 'Não foi possível sincronizar com o Asaas.'); return; }
  update(s=>{
    (result.results||[]).forEach(r=>{
      const m = s.subscriptionMembers.find(x=>x.id===r.memberId);
      if(m){ m.status = r.status; m.lastPaymentDate = r.lastPaymentDate; m.lastPaymentAmount = r.lastPaymentAmount; }
    });
  });
  showToast(`Sincronizado — ${(result.results||[]).length} assinante(s) atualizados.`);
}

        <div><label>Categoria</label><input id="f-category" list="f-category-list" value="${existing?.category||''}" placeholder="Ex: Corte, Combo, Premium" style="width:100%;">

      </div>

  `, root=>{

    root.querySelector('#f-submit').addEventListener('click', ()=>{
      const name = root.querySelector('#f-name').value.trim();

function memberModal(existing){
  if(state.subscriptionPlans.length===0){ showToast('Crie um plano antes de adicionar membros.'); return; }
  const isEdit = !!existing;
  openModal(`
    <div style="padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="font-display" style="font-size:19px;font-weight:600;">${isEdit?'Editar':'Novo'} membro</div>

        <div><label>Telefone</label><input id="f-phone" value="${existing?.phone||''}" style="width:100%;"></div>

        </select></div>

          <div style="flex:1;"><label>Status</label><select id="f-status" style="width:100%;">
            <option value="pago" ${existing?.status==='pago'?'selected':''}>Pago</option>
            <option value="pendente" ${!existing||existing.status==='pendente'?'selected':''}>Pendente</option>
            <option value="atrasado" ${existing?.status==='atrasado'?'selected':''}>Atrasado</option>
            <option value="cancelado" ${existing?.status==='cancelado'?'selected':''}>Cancelado</option>
          </select></div>
        </div>
        <div style="font-size:11.5px;color:var(--muted-2);">Membros via Pix/Cartão têm o status atualizado pela sincronização com o Asaas. Membros em dinheiro são marcados como pagos manualmente na lista.</div>

      </div>

  `, root=>{
    root.querySelector('#m-close').addEventListener('click', closeModal);
    root.querySelector('#f-submit').addEventListener('click', async ()=>{
      const name = root.querySelector('#f-name').value.trim();
      if(!name){ showToast('Informe o nome.'); return; }
      const phone = root.querySelector('#f-phone').value.trim();
      const planId = root.querySelector('#f-plan').value;
      const paymentMethod = root.querySelector('#f-method').value;
      const data = {
        name, phone, planId, paymentMethod,
        dueDate: root.querySelector('#f-due').value,
        status: root.querySelector('#f-status').value,
      };
      if(!isEdit && paymentMethod==='asaas'){
        if(!state.asaas.apiKey){ showToast('Configure sua API Key do Asaas em Integração Asaas antes de cadastrar via Pix/Cartão.'); return; }
        const submitBtn = root.querySelector('#f-submit');
        submitBtn.disabled = true; submitBtn.textContent = 'Criando cobrança no Asaas...';
        const plan = state.subscriptionPlans.find(p=>p.id===planId);
        const newMemberId = uid();
        const { data: result, error } = await supa.functions.invoke('asaas-sync', {
          body: { action:'create_subscription', memberId: newMemberId, memberName:name, memberPhone:phone, planPrice:plan.price, planName:plan.name }
        });
        submitBtn.disabled = false; submitBtn.textContent = isEdit?'Salvar':'Adicionar membro';
        if(error || result?.error){ showToast(result?.error || 'Não foi possível criar a cobrança no Asaas.'); return; }
        update(s=>{ s.subscriptionMembers.push({id:newMemberId, asaasChargeId:'', asaasSubscriptionId:result.subscriptionId, asaasCustomerId:result.customerId, invoiceUrl:result.invoiceUrl, lastPaymentDate:null, lastPaymentAmount:0, ...data}); });
        showToast('Assinante cadastrado e cobrança recorrente criada no Asaas.');
        closeModal();
        return;
      }
      update(s=>{
        if(isEdit){ Object.assign(existing, data); }
        else{ s.subscriptionMembers.push({id:uid(), asaasChargeId:'', asaasSubscriptionId:'', asaasCustomerId:'', invoiceUrl:'', lastPaymentDate:null, lastPaymentAmount:0, ...data}); }
      });
      closeModal();
    });
  });
}

function renderMinhaAssinatura(view){

    canceled: {label:'Cancelada', tone:'bad'},
  }[shop.subscription_status] || {label: shop.subscription_status, tone:'muted'};

  let periodInfo = '';
  if(shop.subscription_status==='trialing' && shop.trial_ends_at){
    const daysLeft = Math.max(0, Math.ceil((new Date(shop.trial_ends_at) - new Date())/86400000));
    periodInfo = `Seu teste grátis termina em ${new Date(shop.trial_ends_at).toLocaleDateString('pt-BR')} (${daysLeft} dia(s) restante(s)).`;

    periodInfo = 'Sua assinatura foi cancelada. Assine novamente para recuperar o acesso.';

      <div style="display:flex;flex-direction:column;gap:12px;max-width:340px;">
        <div><label>Nova senha</label><input id="f-new-pass" type="password" placeholder="Mínimo 6 caracteres" style="width:100%;"></div>

    <div class="card" style="padding:24px;margin-bottom:20px;max-width:560px;border-color:var(--gold);">

      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">

    btn.disabled = true; btn.textContent = 'Abrindo...';

    btn.disabled = false; btn.textContent = original;
    if(error || result?.error){ showToast(result?.error || 'Não foi possível abrir o portal de faturas.'); return; }
    window.open(result.url, '_blank');
  });
}

  const header = ['Nome','Telefone','Aniversario(DD/MM)','Pontos','Observacoes'];
  const rows = state.clients.map(c=>[
    c.name||'', c.phone||'', c.birthday?c.birthday.split('-').reverse().join('/'):'', c.points||0, c.notes||''
  ]);
  const escape = v => {
    const s = String(v).replace(/"/g,'""');
    return /[;,"\n]/.test(s) ? `"${s}"` : s;
  };
  return [header, ...rows].map(r=>r.map(escape).join(';')).join('\n');
}
function downloadCSV(){
  const csv = '\uFEFF' + clientsToCSV();
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `clientes-primer-barber-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Exportação gerada.');
}
function parseCSVLine(line, delim){
  const out = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; } }
      else cur+=ch;
    }else{
      if(ch==='"') inQuotes=true;
      else if(ch===delim){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(v=>v.trim());
}
function importClientsFromCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lines.length===0){ showToast('Arquivo vazio.'); return; }
  const delim = lines[0].includes(';') ? ';' : ',';
  let rows = lines.map(l=>parseCSVLine(l, delim));
  const headerLower = rows[0].map(h=>h.toLowerCase());
  if(headerLower.some(h=>h.includes('nome'))) rows = rows.slice(1);
  let added=0, updated=0;
  update(s=>{
    rows.forEach(r=>{
      const [name, phone, birthdayRaw, pointsRaw, notes] = r;
      if(!name) return;
      let birthday = '';
      const m = (birthdayRaw||'').match(/^(\d{1,2})\/(\d{1,2})$/);
      if(m) birthday = m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
      const points = parseInt(pointsRaw)||0;
      const existing = s.clients.find(c=>c.name.trim().toLowerCase()===name.trim().toLowerCase());
      if(existing){
        Object.assign(existing, {phone:phone||existing.phone, birthday:birthday||existing.birthday, points: pointsRaw?points:existing.points, notes:notes||existing.notes});
        updated++;
      }else{
        s.clients.push({id:uid(), name:name.trim(), phone:phone||'', birthday, points, notes:notes||''});
        added++;
      }
    });
  });
  showToast(`Importação concluída: ${added} novo(s), ${updated} atualizado(s).`);
}

async function acceptBookingRequest(req){
  update(s=>{
    s.appointments.push({id:uid(), date:req.date, time:req.time, professionalId:req.professional_id, serviceId:req.service_id, client:req.client_name, status:'agendado', confirmed:false, depositStatus:'nao_aplicavel', depositAmount:0, createdAt:new Date().toISOString(), rating:null});
  });
  await supa.from('booking_requests').update({status:'aceito'}).eq('id', req.id);
  showToast('Agendamento aceito e adicionado à agenda.');
  await refreshNotifItems();
}
async function declineBookingRequest(id){
  await supa.from('booking_requests').update({status:'recusado'}).eq('id', id);
  showToast('Pedido recusado.');
  await refreshNotifItems();
}

async function loadBookingRequests(view){
  const listEl = view.querySelector('#pb-requests-list');
  const countEl = view.querySelector('#pb-pending-count');
  if(!listEl || !currentShop) return;
  const { data, error } = await supa.from('booking_requests').select('*').eq('shop_id', currentShop.id).eq('status','pendente').order('created_at',{ascending:false});
  if(error){ listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">Não foi possível carregar.</div>'; return; }
  countEl.textContent = (data||[]).length + ' pendente(s)';
  if(!data || !data.length){ listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">Nenhum pedido pendente.</div>'; return; }
  listEl.innerHTML = data.map(r=>`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="font-size:13px;">
        <b>${r.client_name}</b> — ${r.service_name} com ${r.professional_name}<br>
        <span style="color:var(--muted);font-size:11.5px;">${r.date} às ${r.time} · ${r.client_phone}</span>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn btn-gold" data-accept="${r.id}" style="padding:6px 10px;font-size:12px;">Aceitar</button>
        <button class="btn btn-ghost" data-decline="${r.id}" style="padding:6px 10px;font-size:12px;">Recusar</button>
      </div>
    </div>
  `).join('');
  listEl.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click', async ()=>{
    const req = data.find(r=>r.id===b.dataset.accept);
    await acceptBookingRequest(req);
    loadBookingRequests(view);
  }));
  listEl.querySelectorAll('[data-decline]').forEach(b=>b.addEventListener('click', async ()=>{
    await declineBookingRequest(b.dataset.decline);
    loadBookingRequests(view);
  }));
}

/* ============ SININHO DE NOTIFICAÇÕES (novos agendamentos em tempo real) ============ */
async function refreshNotifItems(){
  if(!supa || !currentShop) return;
  const { data } = await supa.from('booking_requests').select('*').eq('shop_id', currentShop.id).eq('status','pendente').order('created_at',{ascending:false});
  notifState.items = data || [];
  renderNotifUI();
}
function subscribeBookingNotifications(){
  if(!supa || !currentShop || notifState.channel) return;
  notifState.channel = supa.channel('booking-notify-'+currentShop.id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'booking_requests', filter:`shop_id=eq.${currentShop.id}`}, payload=>{
      notifState.items.unshift(payload.new);
      showToast(`Novo agendamento: ${payload.new.client_name} — ${payload.new.date} às ${payload.new.time}`);
      renderNotifUI();
    })
    .subscribe();
}
function renderNotifUI(){
  const badge = document.getElementById('notif-badge');
  const bell = document.getElementById('btn-notif-bell');
  if(bell){
    const count = notifState.items.length;
    let b = document.getElementById('notif-badge');
    if(count>0){
      if(!b){ b = document.createElement('span'); b.id='notif-badge'; b.style.cssText='position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;'; bell.appendChild(b); }
      b.textContent = count>9?'9+':String(count);
    } else if(b){ b.remove(); }
  }
  const dropdown = document.getElementById('notif-dropdown');
  if(dropdown && notifState.open) dropdown.innerHTML = notifDropdownContent();
}
function notifDropdownContent(){
  if(!notifState.items.length) return `<div style="padding:16px;font-size:12.5px;color:var(--muted);text-align:center;">Nenhum agendamento novo.</div>`;
  return notifState.items.map(r=>`
    <div style="padding:10px 12px;border-bottom:1px solid var(--border);">
      <div style="font-size:13px;"><b>${r.client_name}</b> agendou</div>
      <div style="font-size:12px;color:var(--muted);margin:2px 0 8px;">${r.service_name} com ${r.professional_name} · ${new Date(r.date+'T'+r.time).toLocaleDateString('pt-BR')} às ${r.time}</div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-gold" data-notif-accept="${r.id}" style="padding:5px 10px;font-size:11.5px;">Aceitar</button>
        <button class="btn btn-ghost" data-notif-decline="${r.id}" style="padding:5px 10px;font-size:11.5px;">Recusar</button>
      </div>
    </div>
  `).join('');
}

function readImageAsDataURL(file, maxBytes, cb){
  if(file.size > maxBytes){
    showToast(`Imagem muito grande (máx. ${Math.round(maxBytes/1024)}KB). Escolha uma menor ou comprima antes.`);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => cb(reader.result);
  reader.onerror = () => showToast('Não foi possível ler a imagem.');
  reader.readAsDataURL(file);
}

          <div style="font-size:13px;font-weight:600;margin-bottom:10px;">1. Escolha o serviço</div>
          <div id="pb-services" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
            ${services.map(s=>`
              <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:${pubBooking.serviceId===s.id?'var(--panel-2)':'transparent'};">
                <input type="radio" name="pb-service" value="${s.id}" ${pubBooking.serviceId===s.id?'checked':''} style="width:auto;">
                <div style="flex:1;">
                  <div style="font-size:13.5px;">${s.name}</div>
                  <div style="font-size:11.5px;color:var(--muted);">${BRL(s.price)} · ${s.duration}min</div>
                </div>
              </label>
            `).join('') || '<div style="font-size:12.5px;color:var(--muted);">Nenhum serviço disponível ainda.</div>'}
          </div>

          <div style="font-size:13px;font-weight:600;margin-bottom:10px;">2. Escolha o profissional</div>
          <div id="pb-profs" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
            ${professionals.map(p=>`
              <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:${pubBooking.professionalId===p.id?'var(--panel-2)':'transparent'};">
                <input type="radio" name="pb-prof" value="${p.id}" ${pubBooking.professionalId===p.id?'checked':''} style="width:auto;">
                <div style="font-size:13.5px;">${p.name}</div>
              </label>
            `).join('') || '<div style="font-size:12.5px;color:var(--muted);">Nenhum profissional disponível ainda.</div>'}
          </div>

          <div style="font-size:13px;font-weight:600;margin-bottom:10px;">3. Escolha o dia</div>
          <input id="pb-date" type="date" min="${todayISO()}" value="${pubBooking.date}" style="width:100%;margin-bottom:16px;">

          <div id="pb-slots-wrap"></div>

          <div id="pb-form" style="display:none;flex-direction:column;gap:10px;margin-top:16px;">
            <div style="font-size:13px;font-weight:600;">4. Seus dados</div>
            <div><label>Seu nome</label><input id="pb-name" style="width:100%;"></div>
            <div><label>Telefone (WhatsApp)</label><input id="pb-phone" style="width:100%;" placeholder="(11) 90000-0000"></div>
            <button class="btn btn-gold" id="pb-confirm" style="justify-content:center;">Confirmar agendamento</button>
          </div>
          <div id="pb-done" style="display:none;text-align:center;padding:20px 0;">
            <div style="font-size:15px;font-weight:600;margin-bottom:6px;">Pedido enviado! ✅</div>
            <div style="font-size:12.5px;color:var(--muted);">A barbearia vai confirmar seu horário em breve.</div>
          </div>
        </div>
      </div>
    </div>
  `;
  app.querySelectorAll('input[name="pb-service"]').forEach(r=>r.addEventListener('change', e=>{ pubBooking.serviceId=e.target.value; renderPublicBookingScreen(); }));
  app.querySelectorAll('input[name="pb-prof"]').forEach(r=>r.addEventListener('change', e=>{ pubBooking.professionalId=e.target.value; loadPublicSlots(); }));
  app.querySelector('#pb-date').addEventListener('change', e=>{ pubBooking.date=e.target.value; loadPublicSlots(); });
  if(pubBooking.professionalId) loadPublicSlots();
}

async function loadPublicSlots(){
  const wrap = document.getElementById('pb-slots-wrap');
  const prof = (pubBooking.info.professionals||[]).find(p=>p.id===pubBooking.professionalId);
  if(!wrap || !prof) return;
  wrap.innerHTML = `<div style="font-size:12px;color:var(--muted);">Carregando horários...</div>`;
  const { data: booked } = await supa.rpc('get_booked_times', { p_shop_id: pubBooking.shopId, p_professional_id: prof.id, p_date: pubBooking.date });
  const bookedSet = new Set(booked || []);
  const slots = [];
  let [h,m] = (prof.workStart||'09:00').split(':').map(Number);
  const [endH,endM] = (prof.workEnd||'18:00').split(':').map(Number);
  while(h < endH || (h===endH && m < endM)){
    const t = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    if(!bookedSet.has(t)) slots.push(t);
    m += 30; if(m>=60){m=0;h++;}
  }
  wrap.innerHTML = `
    <div style="font-size:13px;font-weight:600;margin-bottom:10px;">Horários disponíveis</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${slots.map(t=>`<button class="btn btn-ghost pb-slot" data-time="${t}" style="padding:8px 12px;font-size:12.5px;">${t}</button>`).join('') || '<div style="font-size:12.5px;color:var(--muted);">Sem horários livres neste dia.</div>'}
    </div>
  `;
  wrap.querySelectorAll('.pb-slot').forEach(b=>b.addEventListener('click', ()=>{
    pubBooking.time = b.dataset.time;
    wrap.querySelectorAll('.pb-slot').forEach(x=>x.classList.remove('btn-gold'));
    b.classList.add('btn-gold');
    const form = document.getElementById('pb-form');
    form.style.display = 'flex';
    form.scrollIntoView({behavior:'smooth', block:'nearest'});
  }));
}

document.addEventListener('click', function pbConfirmDelegate(e){
  if(e.target && e.target.id === 'pb-confirm') submitPublicBooking();
});
async function submitPublicBooking(){
  const name = document.getElementById('pb-name').value.trim();
  const phone = document.getElementById('pb-phone').value.trim();
  if(!name || !phone || !pubBooking.serviceId || !pubBooking.professionalId || !pubBooking.time){
    alert('Preencha todos os campos e escolha um horário.'); return;
  }
  const service = (pubBooking.info.services||[]).find(s=>s.id===pubBooking.serviceId);
  const prof = (pubBooking.info.professionals||[]).find(p=>p.id===pubBooking.professionalId);
  const { error } = await supa.from('booking_requests').insert({
    shop_id: pubBooking.shopId,
    professional_id: prof.id, professional_name: prof.name,
    service_id: service.id, service_name: service.name,
    client_name: name, client_phone: phone,
    date: pubBooking.date, time: pubBooking.time,
  });
  if(error){ alert('Não foi possível enviar o pedido. Tente novamente.'); return; }
  document.getElementById('pb-form').style.display = 'none';
  document.getElementById('pb-done').style.display = 'block';
}


function authShell(inner){
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div class="card" style="width:100%;max-width:400px;padding:32px;">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:24px;">
          <div style="width:34px;height:34px;border-radius:9px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;padding:5px;">
            <img src="${APP_LOGO_ICON}" style="width:100%;height:100%;object-fit:contain;">
          </div>
          <div class="font-display" style="font-size:19px;font-weight:600;">Primer Barber</div>
        </div>
        ${inner}
      </div>
    </div>
  `;
}

function renderConfigMissing(){
  authShell(`
    <div class="font-display" style="font-size:17px;font-weight:600;margin-bottom:10px;">Configuração pendente</div>
    <div style="font-size:13.5px;color:var(--muted);line-height:1.6;">
      Este app ainda não está ligado a um banco de dados. Preencha <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b>
      no início do código (procure por "CONFIGURAÇÃO — PREENCHA ANTES DE PUBLICAR") antes de publicar este site.
    </div>
  `);
}

function renderAuthScreen(mode, errorMsg){
  const isLogin = mode!=='signup';
  authShell(`
    <div class="font-display" style="font-size:17px;font-weight:600;margin-bottom:4px;">${isLogin?'Entrar':'Criar conta da barbearia'}</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:18px;">${isLogin?'Acesse o painel da sua barbearia.':'Comece seus '+TRIAL_DAYS+' dias grátis.'}</div>
    ${errorMsg?`<div style="background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;">${errorMsg}</div>`:''}
    <div style="display:flex;flex-direction:column;gap:12px;">
      ${!isLogin?`<div><label>Nome da barbearia</label><input id="au-shop" style="width:100%;" placeholder="Ex: Primer Barber"></div>`:''}
      <div><label>Email</label><input id="au-email" type="email" style="width:100%;" placeholder="voce@email.com"></div>
      <div><label>Senha</label><input id="au-pass" type="password" style="width:100%;" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn btn-gold" id="au-submit" style="justify-content:center;margin-top:6px;">${isLogin?'Entrar':'Criar conta'}</button>
      <button class="btn btn-ghost" id="au-switch" style="justify-content:center;">${isLogin?'Não tem conta? Criar uma':'Já tem conta? Entrar'}</button>
    </div>
  `);
  document.getElementById('au-switch').addEventListener('click', ()=>renderAuthScreen(isLogin?'signup':'login'));
  document.getElementById('au-submit').addEventListener('click', async ()=>{
    const email = document.getElementById('au-email').value.trim();
    const pass = document.getElementById('au-pass').value;
    const shopName = document.getElementById('au-shop')?.value.trim();
    if(!email || !pass){ renderAuthScreen(mode, 'Preencha email e senha.'); return; }
    if(isLogin){
      const { error } = await supa.auth.signInWithPassword({ email, password: pass });
      if(error){ renderAuthScreen('login', 'Não foi possível entrar: '+error.message); return; }
    } else {
      const { error } = await supa.auth.signUp({ email, password: pass });
      if(error){ renderAuthScreen('signup', 'Não foi possível criar a conta: '+error.message); return; }
      await ensureShop(shopName || 'Minha barbearia');
    }
    boot();
  });
}

async function ensureShop(defaultName){
  const { data: { user } } = await supa.auth.getUser();
  if(!user) return null;
  const { data: existing } = await supa.from('shops').select('*').eq('owner_id', user.id).maybeSingle();
  if(existing) return existing;
  const trialEnds = new Date(Date.now() + TRIAL_DAYS*24*60*60*1000).toISOString();
  const seeded = blankShopData();
  if(defaultName) seeded.shopProfile.name = defaultName;
  const baseSlug = slugify(defaultName || 'barbearia');
  const uniqueSlug = baseSlug + '-' + Math.random().toString(36).slice(2,7);
  seeded.onlineBooking.slug = uniqueSlug;
  const { data: created, error } = await supa.from('shops').insert({
    owner_id: user.id,
    email: user.email,
    data: seeded,
    booking_slug: uniqueSlug,
    subscription_status: 'trialing',
    trial_ends_at: trialEnds,
  }).select().single();
  if(error){ console.error('Erro ao criar barbearia', error); return null; }
  return created;
}
function slugify(text){
  return (text||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'barbearia';
}

function shopIsActive(shop){
  if(shop.subscription_status==='active') return true;
  if(shop.subscription_status==='trialing'){
    return new Date(shop.trial_ends_at).getTime() > Date.now();
  }
  return false;
}

function renderPaywallScreen(shop){
  const trialExpired = shop.subscription_status==='trialing' && !shopIsActive(shop);
  authShell(`
    <div class="font-display" style="font-size:17px;font-weight:600;margin-bottom:10px;">
      ${trialExpired ? 'Seu período de teste acabou' : 'Assinatura necessária'}
    </div>
    <div style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:20px;">
      ${trialExpired
        ? `Seus ${TRIAL_DAYS} dias grátis terminaram. Escolha um plano para continuar usando o painel da sua barbearia.`
        : 'Escolha um plano para liberar o acesso.'}
    </div>
    ${planPickerHtml(shop)}
    <button class="btn btn-ghost" id="pw-refresh" style="justify-content:center;width:100%;margin-top:14px;">Já assinei, verificar novamente</button>
    <button class="btn btn-ghost" id="pw-logout" style="justify-content:center;width:100%;color:var(--muted);">Sair</button>
  `);
  document.getElementById('pw-refresh').addEventListener('click', boot);
  document.getElementById('pw-logout').addEventListener('click', async ()=>{ await supa.auth.signOut(); boot(); });
}

function planPickerHtml(shop){
  const mk = (planKey, link) => {
    const limits = PLAN_LIMITS[planKey];
    const url = link.startsWith('http')
      ? `${link}${link.includes('?')?'&':'?'}client_reference_id=${shop.id}&prefilled_email=${encodeURIComponent(shop.email||'')}`
      : null;
    return `
      <div class="card" style="padding:16px 18px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div class="font-display" style="font-size:15.5px;font-weight:600;">${limits.label}</div>
          ${shop.plan===planKey && shop.subscription_status==='active' ? `<span class="pill pill-ok">Plano atual</span>` : ''}
        </div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.5;">
          ${planKey==='basic'
            ? 'Até 4 profissionais cadastrados. Sem Clube de Assinatura.'
            : 'Profissionais ilimitados. Clube de Assinatura ativado.'}
        </div>
        ${url
          ? `<a href="${url}" target="_blank" class="btn btn-gold" style="justify-content:center;width:100%;text-decoration:none;">Assinar ${limits.label}</a>`
          : `<div class="pill pill-warn" style="display:block;">Link do plano ${limits.label} não configurado</div>`}
      </div>
    `;
  };
  return mk('basic', STRIPE_PAYMENT_LINK_BASIC) + mk('pro', STRIPE_PAYMENT_LINK_PRO);
}

function renderPaywallUpgrade(fromRoute){
  authShell(`
    <div class="font-display" style="font-size:17px;font-weight:600;margin-bottom:10px;">Fazer upgrade</div>
    <div style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:20px;">Escolha o plano Pro para liberar este recurso.</div>
    ${planPickerHtml(currentShop)}
    <button class="btn btn-ghost" id="pw-back" style="justify-content:center;width:100%;margin-top:14px;">Voltar</button>
  `);
  document.getElementById('pw-back').addEventListener('click', ()=>{ route = fromRoute; render(); });
}

async function boot(){
  if(!supa){ renderConfigMissing(); return; }
  const urlParams = new URLSearchParams(window.location.search);
  const bookSlug = urlParams.get('agendar');
  if(bookSlug){ await renderPublicBooking(bookSlug); return; }
  const { data: { session } } = await supa.auth.getSession();
  if(!session){ renderAuthScreen('login'); return; }
  let shop = await ensureShop();
  if(!shop){
    // fallback: pode já existir mas a criação acima não rodou (ex: login direto)
    const { data } = await supa.from('shops').select('*').eq('owner_id', session.user.id).maybeSingle();
    shop = data;
  }
  if(!shop){ renderAuthScreen('login', 'Não encontramos sua barbearia. Fale com o suporte.'); return; }
  currentShop = shop;
  if(!shopIsActive(shop)){ renderPaywallScreen(shop); return; }
  await loadState();
  await refreshNotifItems();
  subscribeBookingNotifications();
}

/* ============ INIT ============ */
boot();
</script>
