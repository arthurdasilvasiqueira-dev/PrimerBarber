<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Calculadora do Clube</title>
<style>
/* Layout: uma coluna no celular; no computador, formulário à esquerda e planos à direita.
   Visual único e escuro com dourado, como pedido. Só fontes do sistema para funcionar sem internet. */
:root {
  color-scheme: dark;
  --bg: #121110;
  --surface: #1c1a17;
  --surface-2: #26231f;
  --line: #3b362e;
  --fg: #f4efe6;
  --muted: #b5ac9c;
  --gold: #d9b45b;
  --gold-strong: #f0cf7e;
  --on-gold: #1a1408;
  --danger: #ff6b5e;
  --danger-bg: #3a1613;
  --warn: #f3b344;
  --warn-bg: #352710;
  --ok: #6fd08c;
  --ok-bg: #14301e;
  --font-title: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
.pole {
  height: 8px;
  background: repeating-linear-gradient(135deg, var(--gold) 0 14px, var(--bg) 14px 28px);
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 20px;
}
header { display: grid; gap: 4px; }
.brand {
  font-family: var(--font-title);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold);
}
h1 {
  margin: 0;
  font-family: var(--font-title);
  font-size: clamp(30px, 8vw, 42px);
  line-height: 1.05;
  font-weight: 700;
  text-wrap: balance;
}
.lead { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.cols { display: grid; gap: 20px; }
.cols > * { min-width: 0; }
@media (min-width: 900px) {
  .cols { grid-template-columns: 420px minmax(0, 1fr); align-items: start; }
}
form, .plan, .topo {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
form { padding: 16px; display: grid; gap: 16px; }
.field { display: grid; gap: 5px; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
.two > * { min-width: 0; }
label, .legend { font-size: 14px; font-weight: 600; }
.opt { color: var(--muted); font-weight: 400; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 5px; min-width: 0; }
legend { padding: 0; }
input[type="text"] {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  font: inherit;
  color: var(--fg);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
}
input[type="text"]::placeholder { color: #8d8576; }
input.bad { border-color: var(--danger); }
:focus-visible { outline: 2px solid var(--gold-strong); outline-offset: 2px; }
.err { min-height: 0; font-size: 13px; color: var(--danger); }
.err:empty { display: none; }
.hint { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px;
  min-width: 52px;
  padding: 6px 12px;
  font: inherit;
  font-size: 15px;
  color: var(--fg);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 700; }
.btn {
  min-height: 48px;
  width: 100%;
  padding: 10px 14px;
  font: inherit;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
}
.btn-gold { background: var(--gold); border: 1px solid var(--gold); color: var(--on-gold); }
.btn-gold:hover { background: var(--gold-strong); }
.btn-line { background: transparent; border: 1px solid var(--line); color: var(--fg); }
.btn-line:hover { border-color: var(--gold); }
.results { display: grid; gap: 16px; }
.results > * { min-width: 0; }
.topo { padding: 14px 16px; display: grid; gap: 2px; }
.topo strong {
  font-family: var(--font-title);
  font-size: 24px;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.topo span { color: var(--muted); font-size: 14px; }
.topo .sample { font-size: 14px; color: var(--gold-strong); }
.plan { padding: 16px; display: grid; gap: 14px; }
.plan h2 {
  margin: 0;
  font-family: var(--font-title);
  font-size: 22px;
  letter-spacing: .02em;
}
.inclui { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.preco { display: grid; gap: 0; }
.preco small { color: var(--muted); font-size: 13px; }
.preco b {
  font-family: var(--font-title);
  font-size: 38px;
  line-height: 1.1;
  color: var(--gold-strong);
  font-variant-numeric: tabular-nums;
}
.linhas { margin: 0; display: grid; gap: 0; }
.linhas div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-top: 1px solid var(--line);
}
.linhas dt { color: var(--muted); }
.linhas dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.alerta { padding: 10px 12px; border-radius: 8px; border: 1px solid; font-size: 14px; }
.alerta strong { display: block; font-size: 15px; }
.alerta.perigo { background: var(--danger-bg); border-color: var(--danger); }
.alerta.perigo strong { color: var(--danger); }
.alerta.atencao { background: var(--warn-bg); border-color: var(--warn); }
.alerta.atencao strong { color: var(--warn); }
.alerta.ok { background: var(--ok-bg); border-color: var(--ok); }
.alerta.ok strong { color: var(--ok); }
.sim-t { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.sim-box { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; border-top: 0; }
th:first-child, td:first-child { text-align: left; }
.falta { color: var(--muted); margin: 0; }
.copia { display: grid; gap: 6px; }
.copia textarea {
  width: 100%;
  min-height: 170px;
  padding: 10px;
  font: inherit;
  font-size: 14px;
  color: var(--fg);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.vazio { padding: 16px; display: grid; gap: 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.vazio p { margin: 0; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; max-width: 70ch; }
footer p { margin: 0 0 6px; }
h2.sec {
  margin: 0;
  font-family: var(--font-title);
  font-size: 19px;
  color: var(--gold-strong);
}
.bloco { display: grid; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.bloco:first-child { padding-top: 0; border-top: 0; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; }
.three > * { min-width: 0; }
.dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dia { position: relative; }
.dia input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.dia span {
  display: grid;
  place-items: center;
  width: 100%;
  height: 36px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 7px;
}
.dia input:checked + span { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.dia input:focus-visible + span { outline: 2px solid var(--gold-strong); outline-offset: 2px; }
.servico { display: grid; gap: 8px; padding: 10px; background: var(--surface-2); border-radius: 8px; }
.servico input[type="text"] { background: var(--surface); }
.servico .dia span { background: var(--surface); }
.servico .dia input:checked + span { background: var(--gold); }
.servico.off > :not(.oferece) { display: none; }
.oferece { display: flex; align-items: center; gap: 8px; font-weight: 700; min-height: 28px; }
.oferece input { width: 20px; height: 20px; accent-color: var(--gold); }
input:disabled { opacity: .75; }
.resumo { margin: 0; }
details.plan { padding: 0; display: block; }
details.plan > summary {
  list-style: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 10px;
  padding: 14px 16px;
  cursor: pointer;
}
details.plan > summary::-webkit-details-marker { display: none; }
.s-nome { font-family: var(--font-title); font-size: 19px; font-weight: 700; }
.s-preco { font-family: var(--font-title); font-size: 21px; font-weight: 700; color: var(--gold-strong); text-align: right; font-variant-numeric: tabular-nums; }
.s-dias { color: var(--muted); font-size: 13px; }
.pill { justify-self: end; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.pill.perigo { color: var(--danger); background: var(--danger-bg); border-color: var(--danger); }
.pill.atencao { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
.pill.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.corpo { display: grid; gap: 14px; padding: 0 16px 16px; }
.corpo > * { min-width: 0; }
.dica { font-size: 13px; color: var(--muted); margin: 0; }
.link-site { display: grid; place-items: center; text-align: center; text-decoration: none; }
.sugs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sugs > * { min-width: 0; }
.sug { display: grid; gap: 4px; align-content: start; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }
.sug small { color: var(--muted); font-size: 13px; }
.sug b { font-family: var(--font-title); font-size: 22px; color: var(--gold-strong); font-variant-numeric: tabular-nums; }
.sug span { font-size: 13px; color: var(--muted); }
.sug button { min-height: 38px; padding: 4px 6px; font: inherit; font-size: 14px; font-weight: 700; color: var(--fg); background: transparent; border: 1px solid var(--gold); border-radius: 7px; cursor: pointer; }
.sug button:hover { background: var(--gold); color: var(--on-gold); }
.tab-sug th:not(:first-child), .tab-sug td:not(:first-child) { color: var(--gold-strong); }
.tab-sug th { color: var(--muted) !important; }
.tab-sug td:first-child { white-space: normal; }
</style>
</head>
<body>
<div class="pole" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand">Cadeira Assinada</div>
    <h1>Calculadora de Preço do Clube</h1>
    <p class="lead">Coloque o valor do corte e receba dois preços de assinatura: o ideal e um mais barato para atrair cliente.</p>
  </header>
  <div class="cols">
    <form id="form" autocomplete="off" novalidate></form>
    <section class="results" id="resultado" aria-live="polite" aria-label="Resultado dos planos"></section>
  </div>
  <footer>
    <p>Todos os valores são simulações matemáticas. Não são promessa de ganho.</p>
    <p>Nada do que você digita sai deste aparelho. Não precisa de cadastro.</p>
  </footer>
</div>

<script id="contas">
/* Contas puras, sem tela. A planilha usa as mesmas regras. */
var MARGEM_MINIMA = 0.20;
var MARGEM_APERTADA = 0.30;
var DESCONTO_MAXIMO = 40;
var POR_SEMANA = 4.33;
var ASSINANTES = [10, 20, 30, 50];
var DIAS = [['seg', 'Seg', 'segunda'], ['ter', 'Ter', 'terça'], ['qua', 'Qua', 'quarta'], ['qui', 'Qui', 'quinta'], ['sex', 'Sex', 'sexta'], ['sab', 'Sáb', 'sábado'], ['dom', 'Dom', 'domingo']];
var TIPOS = [['basico', 'Básico'], ['premium', 'Premium']];
var SERVICOS = [['cabelo', 'Cabelo'], ['barba', 'Barba'], ['combo', 'Cabelo + barba']];

/* Aceita 40 | 40,5 | 40.5 | 1.234,56 | 1,234.56 | R$ 40,00. Vazio = null. Inválido = NaN. */
function lerNumero(texto) {
  var s = String(texto == null ? '' : texto).replace(/R\$/gi, '').replace(/%/g, '').replace(/\s/g, '');
  if (s === '') return null;
  if (!/^-?[\d.,]+$/.test(s) || !/\d/.test(s)) return NaN;
  var v = s.lastIndexOf(','), p = s.lastIndexOf('.');
  if (v >= 0 && p >= 0) {
    if (v > p) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (v >= 0) {
    if ((s.match(/,/g) || []).length > 1) return NaN;
    s = s.replace(',', '.');
  } else if (p >= 0) {
    if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    else if ((s.match(/\./g) || []).length > 1) return NaN;
  }
  var n = Number(s);
  return isFinite(n) ? n : NaN;
}

/* Arredonda para cima terminando em ,90. Ex.: 92,53 vira 92,90. */
function final90(x) { return Math.max(Math.ceil(Math.round((x - 0.9) * 1e6) / 1e6), 0) + 0.9; }

function centavos(n) { return Math.round((n + (n < 0 ? -1 : 1) * 1e-9) * 100) / 100; }

function reais(n) {
  var neg = n < 0;
  var partes = Math.abs(centavos(n)).toFixed(2).split('.');
  return (neg ? '-' : '') + 'R$ ' + partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + partes[1];
}

/* ['ter','qua','qui'] -> "terça a quinta" */
function diasTexto(lista) {
  var idx = DIAS.map(function (d, i) { return lista.indexOf(d[0]) >= 0 ? i : -1; }).filter(function (i) { return i >= 0; });
  if (!idx.length) return '';
  if (idx.length === 7) return 'todos os dias';
  var seguidos = idx[idx.length - 1] - idx[0] === idx.length - 1;
  if (idx.length === 1) return DIAS[idx[0]][2];
  if (seguidos) return DIAS[idx[0]][2] + ' a ' + DIAS[idx[idx.length - 1]][2];
  var nomes = idx.map(function (i) { return DIAS[i][2]; });
  return nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1];
}

function frequenciaTexto(v) {
  if (Math.abs(v - POR_SEMANA) < 0.01) return '1 vez por semana';
  return v === 1 ? '1 vez por mês' : String(v).replace('.', ',') + ' vezes por mês';
}

function base(d) {
  return { contas: d.contas };
}

/* Base: valor do serviço x quantidade de cortes da base. Premium custa a mais. */
function sugerir(pl, d) {
  var av = d.avulso[pl.servico];
  var cortes = d.baseCortes > 0 ? d.baseCortes : 2;
  if (!(av > 0)) return { popular: null, ideal: null };
  var fator = pl.tipo === 'premium' ? 1 + (d.premiumMais || 0) / 100 : 1;
  var referencia = av * cortes * fator;
  return {
    referencia: centavos(av * cortes),
    popular: centavos(final90(referencia * (1 + (d.ajPopular || 0) / 100))),
    ideal: centavos(final90(referencia * (1 + (d.ajIdeal || 0) / 100)))
  };
}

function calcularPlano(pl, d, b) {
  var p = { tipo: pl.tipo, nomeTipo: pl.nomeTipo, servico: pl.servico, nomeServico: pl.nomeServico, dias: pl.dias, id: pl.tipo + '-' + pl.servico };
  var v = d.visitas;
  var av = d.avulso[pl.servico];
  if (av != null && pl.tipo === 'premium' && d.extra > 0) { av += d.extra; p.comExtra = true; }
  if (!(v > 0)) { p.pronto = false; p.falta = 'Preencha quantas vezes o cliente pode vir.'; return p; }
  p.semAssinatura = av > 0 ? centavos(av * v) : null;
  var sg = sugerir(pl, d);
  p.popular = sg.popular;
  p.ideal = sg.ideal;
  if (d.modoPreco === 'desconto') {
    p.desconto = d.desc[pl.tipo];
    if (p.semAssinatura == null) { p.pronto = false; p.falta = 'Preencha o preço avulso deste serviço.'; return p; }
    if (p.desconto == null) { p.pronto = false; p.falta = 'Preencha o desconto do plano ' + pl.nomeTipo + '.'; return p; }
    p.preco = centavos(p.semAssinatura * (1 - p.desconto / 100));
  } else if (pl.preco > 0) {
    p.preco = pl.preco;
  } else if (sg.ideal != null) {
    p.preco = sg.ideal;
    p.sugerido = true;
  } else {
    p.pronto = false;
    p.falta = 'Preencha o preço avulso deste serviço para receber uma sugestão.';
    return p;
  }
  p.pronto = true;
  if (p.semAssinatura != null) {
    p.economiaMes = centavos(p.semAssinatura - p.preco);
    p.economiaAno = centavos(p.economiaMes * 12);
    p.descontoCliente = Math.round(p.economiaMes / p.semAssinatura * 100);
  }
  var c = d.comissao;
  var valor = c.valor > 0 ? c.valor : 0;
  function comissaoDe(x) { return centavos(c.modo === 'corte' ? valor * v : x * valor / 100); }
  p.comissao = comissaoDe(p.preco);
  p.outros = centavos((d.outros || 0) * v);
  p.sobra = centavos(p.preco - p.comissao - p.outros);
  p.margem = p.sobra / p.preco;
  p.temCusto = valor > 0 || p.outros > 0;
  function detalhe(x) {
    var sobra = centavos(x - comissaoDe(x) - p.outros);
    return {
      preco: x,
      sobra: sobra,
      desconto: p.semAssinatura != null ? Math.round((p.semAssinatura - x) / p.semAssinatura * 100) : null,
      assinantes: b.contas > 0 && sobra > 0 ? Math.ceil(b.contas / sobra - 1e-9) : null
    };
  }
  p.opIdeal = p.ideal != null ? detalhe(p.ideal) : null;
  p.opPopular = p.popular != null ? detalhe(p.popular) : null;
  p.assinantesContas = detalhe(p.preco).assinantes;
  if (c.modo === 'pote') {
    var f = d.fichas[pl.servico];
    if (f > 0 && valor > 0) {
      p.valorFicha = centavos(p.preco * valor / 100 / (v * f));
      p.barbeiroPorAtend = centavos(p.preco * valor / 100 / v);
    }
  }
  p.simulacao = ASSINANTES.map(function (q) {
    return { assinantes: q, receita: centavos(p.preco * q), lucro: p.temCusto ? centavos(p.sobra * q) : null, agenda: null };
  });
  p.alerta = avaliar(p, d, b);
  return p;
}

function contasTexto(p) {
  return p.assinantesContas != null ? ' ' + p.assinantesContas + ' assinantes assim pagam as contas do mês.' : '';
}

function avaliar(p, d) {
  if (!p.temCusto) return { nivel: 'atencao', rotulo: 'Falta comissão', titulo: 'Falta a comissão', texto: 'Coloque a comissão dos barbeiros para ver quanto sobra neste plano.' };
  if (p.sobra <= 0) return { nivel: 'perigo', rotulo: 'Prejuízo', titulo: 'Prejuízo de ' + reais(-p.sobra) + ' por assinante', texto: 'O plano não cobre a comissão e o produto. Suba o preço ou reduza as visitas.' };
  if (p.margem < MARGEM_MINIMA) return { nivel: 'perigo', rotulo: 'Barato demais', titulo: 'Plano barato demais', texto: 'Sobram só ' + reais(p.sobra) + ' por assinante.' + contasTexto(p) };
  if (d.modoPreco === 'desconto' && p.desconto > DESCONTO_MAXIMO) return { nivel: 'perigo', rotulo: 'Desconto alto', titulo: 'Desconto alto demais', texto: 'Acima de ' + DESCONTO_MAXIMO + '% o plano fica barato demais.' };
  if (p.economiaMes != null && p.economiaMes <= 0) return { nivel: 'atencao', rotulo: 'Sem economia', titulo: 'Cliente não economiza', texto: 'O plano sai igual ou mais caro que o avulso. Ele vai ter pouco motivo para assinar.' };
  if (p.margem < MARGEM_APERTADA) return { nivel: 'atencao', rotulo: 'Apertado', titulo: 'Lucro apertado', texto: 'Sobram ' + reais(p.sobra) + ' por assinante.' + contasTexto(p) };
  return { nivel: 'ok', rotulo: 'Seguro', titulo: 'Preço seguro', texto: 'Sobram ' + reais(p.sobra) + ' por assinante.' + contasTexto(p) };
}

function calcular(d) {
  var b = base(d);
  return { base: b, planos: d.planos.filter(function (pl) { return pl.on; }).map(function (pl) { return calcularPlano(pl, d, b); }) };
}

function textoWhatsApp(p, d, nome) {
  var l = [];
  if (nome) l.push('*' + nome + '*');
  l.push('*Clube de assinatura: ' + p.nomeServico + ' ' + p.nomeTipo + '*', '');
  l.push('Inclui: ' + p.nomeServico + (p.comExtra ? ' + sobrancelha ou pezinho' : '') + ', ' + frequenciaTexto(d.visitas));
  var dias = diasTexto(p.dias);
  if (dias) l.push('Válido: ' + dias);
  l.push('Valor: ' + reais(p.preco) + ' por mês');
  if (p.economiaMes > 0) {
    l.push('', 'Sem assinatura você pagaria ' + reais(p.semAssinatura) + '.');
    l.push('Você economiza ' + reais(p.economiaMes) + ' por mês (' + reais(p.economiaAno) + ' por ano).');
  }
  l.push('', 'Quer entrar no clube? É só me responder aqui.');
  return l.join('\n');
}

  function guardar() {

  function recuperar() {

      }).join('') + '</tbody></table></div></div>';

      sugestoes(p) +
      '<dl class="linhas">' + linhas.join('') + '</dl>' +
      '<div><p class="sim-t">Simulação de receita mensal fixa</p><div class="sim-box"><table><thead><tr><th>Assinantes</th><th>Receita</th>' +
        (comLucro ? '<th>Sobra</th>' : '') + (comAgenda ? '<th>Agenda</th>' : '') + '</tr></thead><tbody>' + sim + '</tbody></table></div>' +
        (comAgenda ? '<p class="dica">Agenda é quanto dos seus atendimentos do mês esses assinantes usariam.</p>' : '') + '</div>' +
      '<div class="copia"><button type="button" class="btn btn-gold" data-copiar="' + p.id + '">Copiar texto do plano</button><div data-saida="' + p.id + '"></div></div>' +
      '</div></details>';
  }

  function desenhar() {
    var d = lerDados();
    marcar();
    var alvo = el('resultado');
    var nada = !['nome', 'aluguel', 'agua', 'luz', 'outrasContas', 'visitas', 'avCabelo', 'avBarba', 'avCombo', 'basico-cabelo-preco', 'basico-barba-preco', 'basico-combo-preco', 'premium-cabelo-preco', 'premium-barba-preco', 'premium-combo-preco'].some(function (k) { return String(S[k] || '').trim(); });
    if (nada) {
      atual = null;
      alvo.innerHTML = '<div class="vazio"><p>Tudo limpo. Preencha o valor do corte, a comissão e as contas para ver os preços.</p><button type="button" class="btn btn-line" id="ver-exemplo">Ver um exemplo</button></div>';
      return;
    }
    atual = calcular(d);
    dadosAtuais = d;

      (atual.planos.length ? atual.planos.map(function (p) { return cartao(p, d); }).join('') : '<div class="vazio"><p>Marque ao menos um plano para oferecer.</p></div>') +
      SITE;

  function aviso(botao, texto) {
    botao.textContent = texto;

  function mostrarParaCopiar(id, texto) {
    var caixa = document.querySelector('[data-saida="' + id + '"]');

    t.value = texto;
    t.focus();
    t.select();

    var id = botao.dataset.copiar;
    var plano = atual.planos.filter(function (p) { return p.id === id; })[0];
    if (!plano) return;
    var texto = textoWhatsApp(plano, dadosAtuais, String(S.nome || '').trim());
    var feito = plano.alerta.nivel === 'perigo' ? 'Copiado, mas o alerta está vermelho' : 'Texto copiado. Cole no WhatsApp';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { aviso(botao, feito); }, function () { mostrarParaCopiar(id, texto); });
    } else {
      mostrarParaCopiar(id, texto);
    }
  }
  function mudou() { ehExemplo = false; guardar(); desenhar(); }

  montarForm();
  var form = el('form');

  form.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.k) { S[t.dataset.k] = t.value; mudou(); }

    var t = e.target;
    if (t.dataset.dias) {
      var k = t.dataset.dias, lista = (S[k] || []).filter(function (x) { return x !== t.value; });

      S[t.dataset.on] = t.checked;
      mudou();
    }

  form.addEventListener('click', function (e) {
    var b = e.target.closest('button');

    else if (b.dataset.mp) { S.modoPreco = b.dataset.mp; mudou(); }
    else if (b.dataset.v) { S.visitas = b.dataset.v; el('visitas').value = b.dataset.v; mudou(); }
    else if (b.id === 'limpar') { S = vazio(); abertos = {}; preencher(); mudou(); }
  });
  var res = el('resultado');
  res.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copiar]');
    if (b) { copiar(b); return; }
    var u = e.target.closest('[data-usar]');
    if (u) {
      S[u.dataset.usar + '-preco'] = reais(Number(u.dataset.valor)).replace('R$ ', '');
      S.modoPreco = 'digito';
      preencher();
      mudou();
      return;
    }
    if (e.target.id === 'ver-exemplo') { S = JSON.parse(JSON.stringify(EXEMPLO)); ehExemplo = true; preencher(); desenhar(); }
  });
  res.addEventListener('toggle', function (e) {
    if (e.target.dataset && e.target.dataset.plano) abertos[e.target.dataset.plano] = e.target.open;
  }, true);

  var salvo = recuperar();
  if (salvo) { S = salvo; } else { S = JSON.parse(JSON.stringify(EXEMPLO)); ehExemplo = true; }
  preencher();
  desenhar();
})();
</script>
